<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07080d;
            --panel: rgba(20, 20, 30, 0.92);
            --border: rgba(255,255,255,0.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        header {
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(8px + env(safe-area-inset-top))
                14px
                8px;

            border-bottom: 1px solid var(--border);

            background: rgba(7,8,13,0.60);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 750;
        }

        .mini-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            object-fit: cover;

            box-shadow:
                0 0 20px rgba(117,92,255,0.45);
        }

        .online {
            font-size: 11px;
            color: #79ffac;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .header-button {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.06);
            color: white;

            min-height: 38px;
            padding: 8px 11px;

            border-radius: 12px;
            cursor: pointer;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;
            overflow-y: auto;

            padding: 25px 16px 20px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;
            text-align: center;
            max-width: 520px;
            padding: 20px;
        }

        .hero-logo {
            width: 115px;
            height: 115px;

            border-radius: 27px;
            object-fit: cover;

            box-shadow:
                0 0 35px rgba(117,92,255,.38),
                0 18px 50px rgba(0,0,0,.4);

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 34px;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.5;
            font-size: 15px;
        }

        .features {
            margin-top: 20px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feature {
            background: rgba(255,255,255,.055);
            border: 1px solid var(--border);
            border-radius: 20px;

            padding: 7px 11px;

            color: #b7b7c5;
            font-size: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 88%;
        }

        .message-row.user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;
            border-radius: 19px;

            line-height: 1.45;
            font-size: 15px;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .speak-message {
            margin-top: 5px;

            border: none;
            background: transparent;
            color: #9e9eae;

            font-size: 17px;
            cursor: pointer;
        }

        .recording-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 8px;

            color: #ff8294;
            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--danger);

            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
                transform: scale(.8);
            }
        }

        .input-area {
            flex-shrink: 0;

            padding:
                8px
                12px
                calc(10px + env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    transparent,
                    rgba(7,8,13,.98) 25%
                );
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 6px;

            padding: 7px;

            background: rgba(24,24,35,.97);

            border:
                1px solid rgba(255,255,255,.11);

            border-radius: 22px;

            box-shadow:
                0 12px 40px rgba(0,0,0,.32);
        }

        textarea {
            flex: 1;

            resize: none;

            max-height: 130px;
            min-height: 42px;

            padding: 11px 6px;

            background: transparent;
            border: none;
            outline: none;

            color: white;

            font: inherit;
            font-size: 16px;
        }

        textarea::placeholder {
            color: #777786;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;
            border-radius: 14px;

            font-size: 19px;
            cursor: pointer;
        }

        .attach {
            background: rgba(255,255,255,.06);
            color: white;
        }

        .mic {
            background: rgba(255,255,255,.06);
            color: white;
        }

        .mic.recording {
            background: var(--danger);
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send:disabled {
            opacity: .45;
        }

        .input-note {
            text-align: center;
            color: #5f5f6b;
            font-size: 10px;
            margin-top: 6px;
        }

        #fileInput {
            display: none;
        }

        @media (max-width: 600px) {
            .message-row {
                max-width: 90%;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .hero-logo {
                width: 105px;
                height: 105px;
            }

            .new-chat-text {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <img
                class="mini-logo"
                src="/static/logo.png.PNG"
                alt="Wiens AI"
            >

            <div>
                Wiens AI

                <div class="online">
                    ● AI Online
                </div>
            </div>

        </div>

        <div class="header-actions">

            <button
                id="speakerButton"
                class="header-button"
                onclick="toggleSpeech()"
                title="Озвучивание ответов"
            >
                🔊
            </button>

            <button
                class="header-button"
                onclick="newChat()"
            >
                ＋
                <span class="new-chat-text">
                    Новый чат
                </span>
            </button>

        </div>

    </header>


    <main id="chat">

        <div
            class="welcome"
            id="welcome"
        >

            <img
                class="hero-logo"
                src="/static/logo.png.PNG"
                alt="Wiens AI"
            >

            <h1>
                Wiens AI
            </h1>

            <p>
                Чем я могу помочь?
                <br>
                Напишите или отправьте голосовое сообщение.
            </p>

            <div class="features">

                <div class="feature">
                    🧠 AI
                </div>

                <div class="feature">
                    🌐 Internet
                </div>

                <div class="feature">
                    🎙️ Voice
                </div>

                <div class="feature">
                    🔊 Speech
                </div>

                <div class="feature">
                    🇷🇺 🇩🇪 🇬🇧
                </div>

            </div>

        </div>

    </main>


    <div
        class="recording-bar"
        id="recordingBar"
    >
        <div class="recording-dot"></div>

        <span id="recordingText">
            Запись голоса…
        </span>
    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-button attach"
                onclick="
                    document
                    .getElementById('fileInput')
                    .click()
                "
                title="Добавить изображение"
            >
                ＋
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*"
            >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Сообщение Wiens AI..."
            ></textarea>

            <button
                class="icon-button mic"
                id="micButton"
                onclick="toggleRecording()"
                title="Голосовое сообщение"
            >
                🎙️
            </button>

            <button
                class="icon-button send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="input-note">
            Wiens AI может допускать ошибки
        </div>

    </div>

</div>


<script>

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const recordingBar =
    document.getElementById("recordingBar");

const recordingText =
    document.getElementById("recordingText");

const speakerButton =
    document.getElementById("speakerButton");


let history = [];

let mediaRecorder = null;

let audioChunks = [];

let recording = false;

let speechEnabled = true;


function addMessage(text, role) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const row =
        document.createElement("div");

    row.className =
        "message-row "
        +
        (
            role === "user"
            ? "user-row"
            : "assistant-row"
        );


    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    message.textContent = text;

    row.appendChild(message);


    if (
        role === "assistant"
        &&
        !message.classList.contains("thinking")
    ) {

        const speak =
            document.createElement("button");

        speak.className =
            "speak-message";

        speak.textContent = "🔊";

        speak.title =
            "Озвучить ответ";

        speak.onclick =
            function() {
                speakText(text);
            };

        row.appendChild(speak);
    }


    chat.appendChild(row);

    chat.scrollTop =
        chat.scrollHeight;

    return row;
}


async function sendMessage(
    customText = null
) {

    const text =
        (
            customText !== null
            ? customText
            : input.value
        ).trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height = "auto";

    sendButton.disabled = true;


    const thinking =
        addMessage(
            "Wiens AI думает…",
            "assistant thinking"
        );


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text,
                            history: history
                        })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (!response.ok) {

            addMessage(
                data.error ||
                "Произошла ошибка.",
                "assistant"
            );

            return;
        }


        addMessage(
            data.answer,
            "assistant"
        );


        history.push({
            role: "user",
            content: text
        });


        history.push({
            role: "assistant",
            content: data.answer
        });


        if (speechEnabled) {

            speakText(
                data.answer
            );
        }


    } catch (error) {

        thinking.remove();

        addMessage(
            "Не удалось связаться с Wiens AI.",
            "assistant"
        );

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}


async function toggleRecording() {

    if (recording) {

        if (
            mediaRecorder
            &&
            mediaRecorder.state !== "inactive"
        ) {

            mediaRecorder.stop();
        }

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        let options = {};


        if (
            MediaRecorder
            .isTypeSupported(
                "audio/mp4"
            )
        ) {

            options = {
                mimeType:
                    "audio/mp4"
            };

        } else if (
            MediaRecorder
            .isTypeSupported(
                "audio/webm"
            )
        ) {

            options = {
                mimeType:
                    "audio/webm"
            };
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        audioChunks = [];


        mediaRecorder.ondataavailable =
            function(event) {

                if (
                    event.data
                    &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async function() {

                recording = false;

                micButton.classList.remove(
                    "recording"
                );

                micButton.textContent =
                    "🎙️";

                recordingBar.style.display =
                    "none";


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                const mimeType =
                    mediaRecorder.mimeType
                    ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type: mimeType
                        }
                    );


                await transcribeAudio(
                    blob,
                    mimeType
                );
            };


        mediaRecorder.start();


        recording = true;

        micButton.classList.add(
            "recording"
        );

        micButton.textContent =
            "⏹️";

        recordingBar.style.display =
            "flex";

        recordingText.textContent =
            "Запись голоса… нажмите ⏹️ для отправки";


    } catch (error) {

        alert(
            "Не удалось получить доступ к микрофону. Разрешите Safari использовать микрофон."
        );
    }
}


async function transcribeAudio(
    blob,
    mimeType
) {

    recordingBar.style.display =
        "flex";

    recordingText.textContent =
        "Распознаю голос…";


    try {

        const formData =
            new FormData();


        let extension = "webm";

        if (
            mimeType.includes("mp4")
        ) {
            extension = "mp4";
        }


        formData.append(
            "audio",
            blob,
            "voice." + extension
        );


        const response =
            await fetch(
                "/api/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        recordingBar.style.display =
            "none";


        if (!response.ok) {

            addMessage(
                data.error ||
                "Не удалось распознать голос.",
                "assistant"
            );

            return;
        }


        if (data.text) {

            await sendMessage(
                data.text
            );
        }


    } catch (error) {

        recordingBar.style.display =
            "none";

        addMessage(
            "Ошибка отправки голосового сообщения.",
            "assistant"
        );
    }
}


function speakText(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    window
        .speechSynthesis
        .cancel();


    const cleanText =
        text
            .replace(
                /https?:\/\/\S+/g,
                ""
            )
            .replace(
                /[*#`]/g,
                ""
            );


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    const hasCyrillic =
        /[А-Яа-яЁё]/.test(
            cleanText
        );


    const hasGerman =
        /[äöüßÄÖÜ]/.test(
            cleanText
        );


    if (hasCyrillic) {

        utterance.lang =
            "ru-RU";

    } else if (hasGerman) {

        utterance.lang =
            "de-DE";

    } else {

        utterance.lang =
            document.documentElement.lang
            === "de"
            ? "de-DE"
            : "en-US";
    }


    utterance.rate = 1.0;

    utterance.pitch = 1.0;


    window
        .speechSynthesis
        .speak(
            utterance
        );
}


function toggleSpeech() {

    speechEnabled =
        !speechEnabled;


    if (!speechEnabled) {

        window
            .speechSynthesis
            .cancel();

        speakerButton.textContent =
            "🔇";

        speakerButton.classList.remove(
            "speaker-on"
        );

    } else {

        speakerButton.textContent =
            "🔊";

        speakerButton.classList.add(
            "speaker-on"
        );
    }
}


function newChat() {

    history = [];


    if (
        "speechSynthesis"
        in window
    ) {

        window
            .speechSynthesis
            .cancel();
    }


    chat.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <img
                class="hero-logo"
                src="/static/logo.png.PNG"
                alt="Wiens AI"
            >

            <h1>
                Wiens AI
            </h1>

            <p>
                Чем я могу помочь?
                <br>
                Напишите или отправьте голосовое сообщение.
            </p>

            <div class="features">

                <div class="feature">
                    🧠 AI
                </div>

                <div class="feature">
                    🌐 Internet
                </div>

                <div class="feature">
                    🎙️ Voice
                </div>

                <div class="feature">
                    🔊 Speech
                </div>

                <div class="feature">
                    🇷🇺 🇩🇪 🇬🇧
                </div>

            </div>

        </div>
    `;
}


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            )
            + "px";
    }
);


speakerButton.classList.add(
    "speaker-on"
);

</script>

</body>
</html>
