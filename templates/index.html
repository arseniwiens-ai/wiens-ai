<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <meta
        name="theme-color"
        content="#07080d"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Wiens AI"
    >

    <link
        rel="apple-touch-icon"
        href="/static/logo.png.PNG"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel: rgba(20,20,30,.92);
            --drawer: #101019;
            --border: rgba(255,255,255,.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: #9e8cff;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        header {
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            padding:
                calc(8px + env(safe-area-inset-top))
                12px
                8px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,8,13,.60);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .menu-button,
        .header-button {
            min-height: 40px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .menu-button {
            width: 40px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-button {
            padding: 8px 11px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 750;

            min-width: 0;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            object-fit: cover;

            box-shadow:
                0 0 20px
                rgba(117,92,255,.45);

            flex-shrink: 0;
        }

        .brand-label {
            min-width: 0;
        }

        .online {
            margin-top: 2px;
            font-size: 11px;
            color: #79ffac;
        }

        .header-actions {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;
            overflow-y: auto;

            padding:
                18px
                16px
                20px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;

            width: 100%;
            max-width: 540px;

            padding:
                10px 20px 20px;

            text-align: center;
        }

        .assistant-character-wrap {
            position: relative;

            width: 205px;
            height: 235px;

            margin:
                0 auto 6px;
        }

        .assistant-character {
            position: relative;
            z-index: 3;

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(117,92,255,.50)
                );

            animation:
                characterFloat
                3.8s
                ease-in-out
                infinite;

            user-select: none;
            -webkit-user-select: none;
        }

        .assistant-character.speaking {
            animation:
                characterTalk
                .28s
                ease-in-out
                infinite
                alternate;

            filter:
                drop-shadow(
                    0 0 28px
                    rgba(162,108,255,.82)
                );
        }

        .assistant-glow {
            position: absolute;
            z-index: 1;

            left: 50%;
            bottom: 10px;

            width: 145px;
            height: 38px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(117,92,255,.30);

            filter:
                blur(18px);

            animation:
                glowPulse
                2.2s
                ease-in-out
                infinite;
        }

        .character-bubble {
            position: absolute;
            z-index: 5;

            top: 5px;
            right: -35px;

            max-width: 165px;

            padding:
                9px 12px;

            border:
                1px solid var(--border);

            border-radius:
                15px 15px 15px 4px;

            background:
                rgba(23,23,36,.92);

            font-size: 12px;
            line-height: 1.35;

            opacity: 0;

            transform:
                translateY(5px)
                scale(.96);

            pointer-events: none;

            transition:
                .25s;
        }

        .character-bubble.show {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        @keyframes characterFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes characterTalk {
            from {
                transform:
                    translateY(-2px)
                    scale(1);
            }

            to {
                transform:
                    translateY(-7px)
                    scale(1.025);
            }
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: .45;
            }

            50% {
                opacity: .95;
            }
        }

        .welcome h1 {
            margin-bottom: 8px;
            font-size: 34px;
            letter-spacing: -1px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .features {
            margin-top: 18px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 8px;
        }

        .feature {
            padding: 7px 11px;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background:
                rgba(255,255,255,.055);

            color: #b7b7c5;

            font-size: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;

            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;

            border-radius: 19px;

            font-size: 15px;
            line-height: 1.48;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message a {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .sources {
            width: 100%;

            margin-top: 9px;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .sources-title {
            color: #a3a3b3;

            font-size: 11px;
            font-weight: 650;
        }

        .source-card {
            display: flex;
            align-items: center;

            gap: 10px;

            width: 100%;

            padding: 9px 11px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            background:
                rgba(255,255,255,.045);

            color: white;
            text-decoration: none;
        }

        .source-icon {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            flex-shrink: 0;

            border-radius: 9px;

            background:
                rgba(117,92,255,.16);
        }

        .source-text {
            min-width: 0;
        }

        .source-host {
            overflow: hidden;

            color: #ffffff;

            font-size: 12px;
            font-weight: 650;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-url {
            overflow: hidden;

            margin-top: 2px;

            color: #828291;

            font-size: 9px;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-card {
            display: flex;
            align-items: center;

            gap: 10px;

            max-width: 290px;

            padding: 12px 14px;

            margin-bottom: 7px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background:
                rgba(255,255,255,.06);
        }

        .file-icon {
            font-size: 27px;
        }

        .file-name {
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .speak-message {
            margin-top: 5px;

            border: none;

            background: transparent;

            color: #9e9eae;

            font-size: 17px;
        }

        .recording-bar {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 8px;

            color: #ff8294;

            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--danger);

            animation:
                pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
            }
        }

        .attachment-preview-area {
            display: none;

            padding:
                8px
                14px
                0;

            flex-shrink: 0;
        }

        .preview-card {
            position: relative;

            width: fit-content;
            max-width: 90%;
        }

        #imagePreview {
            display: none;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border:
                1px solid var(--border);

            border-radius: 16px;
        }

        #documentPreview {
            display: none;

            align-items: center;

            gap: 9px;

            max-width: 300px;

            padding:
                11px
                38px
                11px
                12px;

            border:
                1px solid var(--border);

            border-radius: 14px;

            background:
                rgba(255,255,255,.06);
        }

        #documentPreviewName {
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        .remove-attachment {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 25px;
            height: 25px;

            border: none;

            border-radius: 50%;

            background: #353542;

            color: white;
        }

        .input-area {
            flex-shrink: 0;

            padding:
                8px
                12px
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );

            background:
                linear-gradient(
                    transparent,
                    rgba(7,8,13,.98)
                    25%
                );
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 6px;

            padding: 7px;

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 22px;

            background:
                rgba(24,24,35,.97);

            box-shadow:
                0 12px 40px
                rgba(0,0,0,.32);
        }

        textarea {
            flex: 1;

            min-height: 42px;
            max-height: 130px;

            padding: 11px 6px;

            border: none;
            outline: none;

            resize: none;

            background: transparent;

            color: white;

            font-size: 16px;
        }

        textarea::placeholder {
            color: #777786;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 14px;

            font-size: 19px;
        }

        .attach,
        .mic {
            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .mic.recording {
            background: var(--danger);
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send.stop {
            background: var(--danger);
        }

        .send:disabled {
            opacity: .45;
        }

        .input-note {
            margin-top: 6px;

            text-align: center;

            color: #5f5f6b;

            font-size: 10px;
        }

        #fileInput {
            display: none;
        }

        .overlay {
            position: fixed;

            inset: 0;

            z-index: 90;

            opacity: 0;

            pointer-events: none;

            background:
                rgba(0,0,0,.55);

            transition: .2s;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            z-index: 100;

            width:
                min(86vw,340px);

            padding:
                calc(
                    14px
                    +
                    env(safe-area-inset-top)
                )
                12px
                calc(
                    14px
                    +
                    env(safe-area-inset-bottom)
                );

            display: flex;
            flex-direction: column;

            border-right:
                1px solid var(--border);

            background: var(--drawer);

            transform:
                translateX(-105%);

            transition:
                transform .22s ease;
        }

        .drawer.open {
            transform:
                translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .drawer-new {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(162,108,255,.35);

            border-radius: 14px;

            background:
                rgba(117,92,255,.20);

            color: white;
        }

        .drawer-close {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }

        #chatList {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;

            margin-bottom: 6px;

            border-radius: 12px;
        }

        .history-item.active {
            background:
                rgba(117,92,255,.13);
        }

        .history-open {
            flex: 1;

            min-width: 0;

            padding: 9px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;
        }

        .history-title {
            overflow: hidden;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-date {
            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;
        }

        .history-delete {
            width: 36px;

            border: none;

            background: transparent;

            color: white;
        }

        @media (max-width: 600px) {
            .new-chat-text {
                display: none;
            }

            .assistant-character-wrap {
                width: 180px;
                height: 205px;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .brand-label {
                max-width: 95px;
                overflow: hidden;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="header-left">

            <button
                class="menu-button"
                onclick="openDrawer()"
            >
                ☰
            </button>

            <div class="brand">

                <img
                    class="mini-logo"
                    src="/static/logo.png.PNG"
                    alt="Wiens AI"
                >

                <div class="brand-label">

                    Wiens AI

                    <div class="online">
                        ● AI Online
                    </div>

                </div>

            </div>

        </div>

        <div class="header-actions">

            <button
                id="speakerButton"
                class="header-button speaker-on"
                onclick="toggleSpeech()"
            >
                🔊
            </button>

            <button
                class="header-button"
                onclick="newChat()"
            >
                ＋

                <span class="new-chat-text">
                    Новый чат
                </span>

            </button>

        </div>

    </header>


    <main id="chat"></main>


    <div
        class="recording-bar"
        id="recordingBar"
    >

        <div class="recording-dot"></div>

        <span id="recordingText">
            Запись…
        </span>

    </div>


    <div
        class="attachment-preview-area"
        id="attachmentPreviewArea"
    >

        <div class="preview-card">

            <img
                id="imagePreview"
                alt="Preview"
            >

            <div id="documentPreview">

                <span id="documentPreviewIcon">
                    📄
                </span>

                <span id="documentPreviewName"></span>

            </div>

            <button
                class="remove-attachment"
                onclick="removeSelectedAttachment()"
            >
                ×
            </button>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-button attach"
                onclick="
                    document
                    .getElementById('fileInput')
                    .click()
                "
            >
                ＋
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*,.pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
            >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Сообщение Wiens AI..."
            ></textarea>

            <button
                class="icon-button mic"
                id="micButton"
                onclick="toggleRecording()"
            >
                🎙️
            </button>

            <button
                class="icon-button send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="input-note">
            Wiens AI может допускать ошибки
        </div>

    </div>

</div>


<div
    class="overlay"
    id="overlay"
    onclick="closeDrawer()"
></div>


<aside
    class="drawer"
    id="drawer"
>

    <div class="drawer-header">

        <h2>
            Чаты
        </h2>

        <button
            class="drawer-close"
            onclick="closeDrawer()"
        >
            ×
        </button>

    </div>

    <button
        class="drawer-new"
        onclick="newChat()"
    >
        ＋ Новый чат
    </button>

    <div id="chatList"></div>

</aside>


<script>

const STORAGE_KEY =
    "wiens_ai_chats_v1";

const ACTIVE_CHAT_KEY =
    "wiens_ai_active_chat_v1";


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const recordingBar =
    document.getElementById("recordingBar");

const recordingText =
    document.getElementById("recordingText");

const speakerButton =
    document.getElementById("speakerButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreviewArea =
    document.getElementById("attachmentPreviewArea");

const imagePreview =
    document.getElementById("imagePreview");

const documentPreview =
    document.getElementById("documentPreview");

const documentPreviewIcon =
    document.getElementById("documentPreviewIcon");

const documentPreviewName =
    document.getElementById("documentPreviewName");

const drawer =
    document.getElementById("drawer");

const overlay =
    document.getElementById("overlay");

const chatList =
    document.getElementById("chatList");


let chats = [];

let activeChatId =
    null;

let history = [];

let selectedFile =
    null;

let selectedFileType =
    null;

let selectedImageURL =
    null;

let mediaRecorder =
    null;

let audioChunks =
    [];

let recording =
    false;

let speechEnabled =
    true;

let streamController =
    null;

let isStreaming =
    false;


function createId() {

    return (
        Date.now()
        .toString(36)
        +
        Math.random()
        .toString(36)
        .slice(2)
    );
}


function createEmptyChat() {

    const now =
        new Date()
        .toISOString();


    return {
        id:
            createId(),

        title:
            "Новый чат",

        createdAt:
            now,

        updatedAt:
            now,

        history:
            [],

        uiMessages:
            []
    };
}


function getActiveChat() {

    return chats.find(
        item =>
            item.id
            === activeChatId
    );
}


function normalizeChat(
    item
) {

    if (!item.history) {
        item.history = [];
    }

    if (!item.uiMessages) {
        item.uiMessages = [];
    }

    if (!item.title) {
        item.title = "Новый чат";
    }

    return item;
}


function saveChats() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(chats)
        );


        localStorage.setItem(
            ACTIVE_CHAT_KEY,
            activeChatId || ""
        );

    } catch (error) {

        console.log(
            "Chat save error",
            error
        );
    }
}


function saveActiveChat() {

    const current =
        getActiveChat();


    if (!current) {
        return;
    }


    normalizeChat(
        current
    );


    current.history =
        history.slice();


    current.updatedAt =
        new Date()
        .toISOString();


    const first =
        current.uiMessages
        .find(
            item =>
                item.role
                === "user"
        );


    if (
        first
        &&
        first.text
    ) {

        current.title =
            first.text
            .slice(
                0,
                35
            );
    }


    saveChats();

    renderChatList();
}


function loadChats() {

    try {

        const saved =
            JSON.parse(
                localStorage
                .getItem(
                    STORAGE_KEY
                )
                ||
                "[]"
            );


        chats =
            Array.isArray(saved)
            ?
            saved.map(
                normalizeChat
            )
            :
            [];

    } catch (error) {

        chats =
            [];
    }


    const savedId =
        localStorage
        .getItem(
            ACTIVE_CHAT_KEY
        );


    if (
        savedId
        &&
        chats.some(
            item =>
                item.id
                === savedId
        )
    ) {

        activeChatId =
            savedId;

    } else if (
        chats.length
    ) {

        activeChatId =
            chats[0].id;

    } else {

        const fresh =
            createEmptyChat();


        chats.push(
            fresh
        );


        activeChatId =
            fresh.id;
    }


    const current =
        getActiveChat();


    history =
        current
        ?
        (
            current.history
            ||
            []
        )
        :
        [];


    renderCurrentChat();

    renderChatList();
}

function extractUrls(
    text
) {

    const matches =
        String(text)
        .match(
            /https?:\/\/[^\s<>"')\]}]+/gi
        )
        ||
        [];


    const cleaned =
        matches.map(
            url =>
                url.replace(
                    /[.,;:!?]+$/,
                    ""
                )
        );


    return [
        ...new Set(cleaned)
    ];
}


function getHostname(
    url
) {

    try {

        return new URL(
            url
        )
        .hostname
        .replace(
            /^www\./,
            ""
        );

    } catch (error) {

        return "Источник";
    }
}


function appendLinkedText(
    container,
    text
) {

    container.innerHTML =
        "";


    const value =
        String(text);


    const regex =
        /https?:\/\/[^\s<>"')\]}]+/gi;


    let lastIndex =
        0;


    let match;


    while (
        (
            match =
                regex.exec(value)
        )
        !== null
    ) {

        if (
            match.index
            >
            lastIndex
        ) {

            container.appendChild(
                document.createTextNode(
                    value.slice(
                        lastIndex,
                        match.index
                    )
                )
            );
        }


        let url =
            match[0];


        const punctuation =
            url.match(
                /[.,;:!?]+$/
            );


        if (punctuation) {

            url =
                url.slice(
                    0,
                    -punctuation[0].length
                );
        }


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.textContent =
            url;


        container.appendChild(
            link
        );


        if (punctuation) {

            container.appendChild(
                document.createTextNode(
                    punctuation[0]
                )
            );
        }


        lastIndex =
            match.index
            +
            match[0].length;
    }


    if (
        lastIndex
        <
        value.length
    ) {

        container.appendChild(
            document.createTextNode(
                value.slice(
                    lastIndex
                )
            )
        );
    }
}

        current
    );


    current.uiMessages.push({
        role,
        type,
        text,
        filename
    });


    saveActiveChat();
}


function renderCurrentChat() {

    chat.innerHTML =
        "";


    const current =
        getActiveChat();


    if (!current) {

        chat.innerHTML =
            welcomeHtml();

        return;
    }


    normalizeChat(
        current
    );


    if (
        current.uiMessages.length
        === 0
    ) {

        chat.innerHTML =
            welcomeHtml();

        return;
    }


    current.uiMessages
    .forEach(
        item => {

            if (
                item.type
                === "image"
            ) {

                addFileCard(
                    "📷",
                    item.filename
                    ||
                    "Изображение",
                    item.text
                );

            } else if (
                item.type
                === "document"
            ) {

                addFileCard(
                    getDocumentIcon(
                        item.filename
                    ),
                    item.filename
                    ||
                    "Документ",
                    item.text
                );

            } else {

                addTextMessage(
                    item.text,
                    item.role
                );
            }
        }
    );
}

        getActiveChat();

        current

        )

        [];

}


function newChat() {

    if (
        isStreaming
    ) {

        stopGeneration();
    }


    saveActiveChat();


    const current =
        getActiveChat();


    if (
        current
        &&
        current.uiMessages
        &&
        current.uiMessages.length
        === 0
    ) {

        renderCurrentChat();

        closeDrawer();

        return;
    }


    const fresh =
        createEmptyChat();


    chats.unshift(
        fresh
    );


    activeChatId =
        fresh.id;


    history =
        [];


    removeSelectedAttachment();


    saveChats();


    renderCurrentChat();


    renderChatList();


    closeDrawer();
}


function deleteChat(
    id
) {

    if (
        !confirm(
            "Удалить чат?"
        )
    ) {

        return;
    }


    if (
        isStreaming
        &&
        id === activeChatId
    ) {

        stopGeneration();
    }


    chats =
        chats.filter(
            item =>
                item.id
                !== id
        );


    if (
        chats.length
        === 0
    ) {

        chats.push(
            createEmptyChat()
        );
    }


    if (
        !chats.some(
            item =>
                item.id
                === activeChatId
        )
    ) {

        activeChatId =
            chats[0].id;
    }


    const current =
        getActiveChat();


    normalizeChat(
        current
    );


    history =
        current
        ?
        (
            current.history
            ||
            []
        )
        :
        [];


    saveChats();


    renderCurrentChat();


    renderChatList();
}


function getDocumentType(
    file
) {

    const name =
        file.name
        .toLowerCase();


    if (
        file.type
        .startsWith(
            "image/"
        )
    ) {

        return "image";
    }


    if (
        name.endsWith(
            ".pdf"
        )
    ) {

        return "pdf";
    }


    if (
        name.endsWith(
            ".docx"
        )
    ) {

        return "docx";
    }


    if (
        name.endsWith(
            ".txt"
        )
    ) {

        return "txt";
    }


    return null;
}


function getDocumentIcon(
    filename
) {

    const name =

        return "📝";
    }

        name.endsWith(

        )
    ) {

        return "📃";
    }


    return "📄";
}

async function sendMessage(
    customText = null
) {

    if (
        isStreaming
    ) {

        stopGeneration();

        return;
    }


    const text =
        (
            customText
            !== null
            ?
            customText
            :
            input.value
        )
        .trim();


    if (
        !text
        &&
        !selectedFile
    ) {

        return;
    }


    if (
        selectedFileType
        === "image"
    ) {

        await sendImage(
            text
        );

        return;
    }


    if (
        selectedFileType
        === "pdf"
        ||
        selectedFileType
        === "docx"
        ||
        selectedFileType
        === "txt"
    ) {

        await sendDocument(
            text
        );

        return;
    }


    addTextMessage(
        text,
        "user"
    );


    remember(
        "user",
        "text",
        text
    );


    input.value =
        "";


    input.style.height =
        "auto";


    /*
        Fresh information and web search.
    */

    if (
        shouldUseWebSearch(
            text
        )
    ) {

        const thinking =
            addTextMessage(
                "🌐 Wiens AI ищет в интернете…",
                "assistant thinking"
            );


        sendButton.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    text,

                                history:
                                    history
                            })
                    }
                );


            const data =
                await response.json();


            thinking.remove();


            if (
                !response.ok
            ) {

                addTextMessage(
                    data.error
                    ||
                    "Произошла ошибка.",
                    "assistant"
                );

                return;
            }


            addTextMessage(
                data.answer,
                "assistant"
            );


            history.push({
                role:
                    "user",

                content:
                    text
            });


            history.push({
                role:
                    "assistant",

                content:
                    data.answer
            });


            remember(
                "assistant",
                "text",
                data.answer
            );


            if (
                speechEnabled
            ) {

                speakText(
                    data.answer
                );
            }

        } catch (error) {

            thinking.remove();


            addTextMessage(
                "Ошибка соединения.",
                "assistant"
            );

        } finally {

            sendButton.disabled =
                false;


            input.focus();
        }


        return;
    }


    /*
        Normal AI answer with streaming.
    */

    removeWelcome();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row assistant-row";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message assistant";


    bubble.textContent =
        "";


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;


    streamController =
        new AbortController();


    setGeneratingState(
        true
    );


    let fullAnswer =
        "";


    try {

        const response =
            await fetch(
                "/api/chat-stream",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text,

                            history:
                                history
                        }),

                    signal:
                        streamController
                        .signal
                }
            );


        if (
            !response.ok
        ) {

            const errorText =
                await response.text();


            throw new Error(
                errorText
                ||
                "Streaming request failed"
            );
        }


        if (
            !response.body
        ) {

            throw new Error(
                "Streaming is not supported"
            );
        }


        const reader =
            response.body
            .getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        while (true) {

            const result =
                await reader.read();


            if (
                result.done
            ) {

                break;
            }


            const chunk =
                decoder.decode(
                    result.value,
                    {
                        stream: true
                    }
                );


            fullAnswer +=
                chunk;


            bubble.textContent =
                fullAnswer;


            chat.scrollTop =
                chat.scrollHeight;
        }


        fullAnswer +=
            decoder.decode();


        if (
            fullAnswer.trim()
        ) {

            appendLinkedText(
                bubble,
                fullAnswer
            );


            history.push({
                role:
                    "user",

                content:
                    text
            });


            history.push({
                role:
                    "assistant",

                content:
                    fullAnswer
            });


            remember(
                "assistant",
                "text",
                fullAnswer
            );


            addSpeakButton(
                row,
                fullAnswer
            );


            addSources(
                row,
                fullAnswer
            );


            if (
                speechEnabled
            ) {

                speakText(
                    fullAnswer
                );
            }
        }

    } catch (error) {

        if (
            error.name
            === "AbortError"
        ) {

            if (
                fullAnswer.trim()
            ) {

                const stoppedAnswer =
                    fullAnswer
                    +
                    "\n\n⏹ Остановлено";


                appendLinkedText(
                    bubble,
                    stoppedAnswer
                );


                history.push({
                    role:
                        "user",

                    content:
                        text
                });


                history.push({
                    role:
                        "assistant",

                    content:
                        fullAnswer
                });


                remember(
                    "assistant",
                    "text",
                    fullAnswer
                );


                addSpeakButton(
                    row,
                    fullAnswer
                );

            } else {

                row.remove();
            }

        } else {

            console.log(
                "Streaming error:",
                error
            );


            bubble.textContent =
                "Ошибка получения ответа.";
        }

    } finally {

        streamController =
            null;


        setGeneratingState(
            false
        );


        input.focus();
    }
}

async function toggleRecording() {

    if (
        recording
    ) {

        if (
            mediaRecorder
            &&
            mediaRecorder.state
            !== "inactive"
        ) {

            mediaRecorder.stop();
        }


        return;
    }


    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio: true
            });


        let options =
            {};


        if (
            MediaRecorder
            .isTypeSupported(
                "audio/mp4"
            )
        ) {

            options = {
                mimeType:
                    "audio/mp4"
            };

        } else if (
            MediaRecorder
            .isTypeSupported(
                "audio/webm"
            )
        ) {

            options = {
                mimeType:
                    "audio/webm"
            };
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        audioChunks =
            [];


        mediaRecorder
        .ondataavailable =
            event => {

                if (
                    event.data
                    &&
                    event.data.size
                    >
                    0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder
        .onstop =
            async () => {

                recording =
                    false;


                micButton.textContent =
                    "🎙️";


                micButton.classList.remove(
                    "recording"
                );


                recordingBar.style.display =
                    "none";


                stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


                const mime =
                    mediaRecorder.mimeType
                    ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mime
                        }
                    );


                await transcribeAudio(
                    blob,
                    mime
                );
            };


        mediaRecorder.start();


        recording =
            true;


        micButton.textContent =
            "⏹️";


        micButton.classList.add(
            "recording"
        );


        recordingBar.style.display =
            "flex";


        recordingText.textContent =
            "Запись голоса… нажмите ⏹️";

    } catch (error) {

        alert(
            "Разрешите доступ к микрофону."
        );
    }
}

        addTextMessage(

            "assistant"
        );
    }
}


function chooseVoice(
    language
) {

    const voices =
        window
        .speechSynthesis
        .getVoices();


    if (
        !voices
        ||
        voices.length
        === 0
    ) {

        return null;
    }


    const prefix =
        language
        .slice(
            0,
            2
        )
        .toLowerCase();


    const matching =
        voices.filter(
            voice =>
                voice.lang
                &&
                voice.lang
                .toLowerCase()
                .startsWith(
                    prefix
                )
        );


    const preferredWords = [
        "premium",
        "enhanced",
        "siri",
        "milena",
        "katja",
        "anna",
        "daniel"
    ];


    for (
        const word
        of
        preferredWords
    ) {

        const preferred =
            matching.find(
                voice =>
                    voice.name
                    .toLowerCase()
                    .includes(
                        word
                    )
            );


        if (preferred) {
            return preferred;
        }
    }


    return (
        matching[0]
        ||
        null
    );
}


function detectSpeechLanguage(
    text
) {

    const clean =
        String(text);


    if (
        /[А-Яа-яЁё]/
        .test(
            clean
        )
    ) {

        return "ru-RU";
    }


    const germanWords =
        /\b(ich|du|der|die|das|und|nicht|ist|sind|mit|für|auf|ein|eine|kann|können|wie|was|warum|bitte|heute|morgen|deutsch|arbeit|haben|habe|hat|werden|wird)\b/i;


    if (
        /[äöüßÄÖÜ]/
        .test(
            clean
        )
        ||
        germanWords.test(
            clean
        )
    ) {

        return "de-DE";
    }


    return "en-US";
}


function speakText(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;
    }


    window
    .speechSynthesis
    .cancel();


    const clean =
        String(
            text
        )
        .replace(
            /https?:\/\/\S+/g,
            ""
        )
        .replace(
            /[*#`]/g,
            ""
        );


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    const language =
        detectSpeechLanguage(
            clean
        );


    utterance.lang =
        language;


    const voice =
        chooseVoice(
            language
        );


    if (voice) {
        utterance.voice = voice;
    }


    utterance.rate =
        .96;


    utterance.pitch =
        .95;


    utterance.onstart =
        () => {

            setCharacterSpeaking(
                true
            );
        };


    utterance.onend =
        () => {

            setCharacterSpeaking(
                false
            );
        };


    utterance.onerror =
        () => {

            setCharacterSpeaking(
                false
            );
        };


    window
    .speechSynthesis
    .speak(
        utterance
    );
}
