<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07080d;
            --panel: rgba(20, 20, 30, 0.94);
            --panel2: #101019;
            --border: rgba(255,255,255,0.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        header {
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(8px + env(safe-area-inset-top))
                12px
                8px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,8,13,0.65);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-button {
            width: 40px;
            height: 40px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 750;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            object-fit: cover;

            box-shadow:
                0 0 20px
                rgba(117,92,255,.45);
        }

        .online {
            font-size: 11px;
            color: #79ffac;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .header-button {
            min-height: 40px;

            padding: 8px 11px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding:
                25px 16px 20px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;

            text-align: center;

            max-width: 520px;

            padding: 20px;
        }

        .hero-logo {
            width: 110px;
            height: 110px;

            border-radius: 27px;

            object-fit: cover;

            box-shadow:
                0 0 35px
                rgba(117,92,255,.38);

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 34px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.5;

            font-size: 15px;
        }

        .features {
            margin-top: 20px;

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;
        }

        .feature {
            background:
                rgba(255,255,255,.055);

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 7px 11px;

            color: #b7b7c5;

            font-size: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;

            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;

            border-radius: 19px;

            line-height: 1.45;

            font-size: 15px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .chat-image {
            display: block;

            max-width: min(290px, 75vw);
            max-height: 360px;

            object-fit: contain;

            border-radius: 17px;

            border:
                1px solid var(--border);

            margin-bottom: 7px;
        }

        .image-placeholder {
            padding: 18px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid var(--border);

            margin-bottom: 7px;

            color: var(--muted);
        }

        .speak-message {
            margin-top: 5px;

            border: none;

            background: transparent;

            color: #aaaabb;

            font-size: 17px;
        }

        .recording-bar {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 8px;

            color: #ff8294;

            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--danger);

            animation:
                pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
            }
        }

        .image-preview-area {
            display: none;

            padding:
                8px
                14px
                0;
        }

        .preview-card {
            position: relative;

            width: 90px;
        }

        #imagePreview {
            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 16px;

            border:
                1px solid var(--border);
        }

        .remove-image {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 25px;
            height: 25px;

            border: none;

            border-radius: 50%;

            background: #353542;

            color: white;
        }

        .input-area {
            flex-shrink: 0;

            padding:
                8px
                12px
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            background:
                linear-gradient(
                    transparent,
                    rgba(7,8,13,.98) 25%
                );
        }

        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 6px;

            padding: 7px;

            background:
                rgba(24,24,35,.97);

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 22px;
        }

        textarea {
            flex: 1;

            resize: none;

            max-height: 130px;
            min-height: 42px;

            padding: 11px 6px;

            background: transparent;

            border: none;
            outline: none;

            color: white;

            font-size: 16px;
        }

        textarea::placeholder {
            color: #777786;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 14px;

            font-size: 19px;
        }

        .attach,
        .mic {
            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .mic.recording {
            background: var(--danger);
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send:disabled {
            opacity: .45;
        }

        .input-note {
            text-align: center;

            color: #5f5f6b;

            font-size: 10px;

            margin-top: 6px;
        }

        #fileInput {
            display: none;
        }

        /* Chat history */

        .overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            opacity: 0;

            pointer-events: none;

            transition: .2s;

            z-index: 90;
        }

        .overlay.open {
            opacity: 1;

            pointer-events: auto;
        }

        .drawer {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width:
                min(86vw, 340px);

            padding:
                calc(
                    14px +
                    env(safe-area-inset-top)
                )
                12px
                calc(
                    14px +
                    env(safe-area-inset-bottom)
                );

            background: var(--panel2);

            border-right:
                1px solid var(--border);

            transform:
                translateX(-105%);

            transition:
                transform .22s ease;

            z-index: 100;

            display: flex;

            flex-direction: column;
        }

        .drawer.open {
            transform:
                translateX(0);
        }

        .drawer-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }

        .drawer-title {
            font-size: 22px;

            font-weight: 750;
        }

        .drawer-close {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 20px;
        }

        .drawer-new {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(162,108,255,.35);

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.3),
                    rgba(162,108,255,.2)
                );

            color: white;

            font-weight: 650;
        }

        #chatList {
            flex: 1;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .history-item {
            display: flex;

            align-items: center;

            gap: 4px;

            padding: 4px;

            border-radius: 13px;

            border:
                1px solid transparent;
        }

        .history-item.active {
            background:
                rgba(117,92,255,.13);

            border-color:
                rgba(162,108,255,.2);
        }

        .history-open {
            flex: 1;

            min-width: 0;

            padding: 8px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;
        }

        .history-title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 14px;
        }

        .history-date {
            color: var(--muted);

            font-size: 10px;

            margin-top: 3px;
        }

        .history-delete {
            width: 34px;
            height: 34px;

            border: none;

            background: transparent;

            color: #9999a8;

            border-radius: 10px;
        }

            max-width: 600px
