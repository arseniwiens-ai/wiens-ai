<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <meta
        name="theme-color"
        content="#07080d"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Wiens AI"
    >

    <link
        rel="apple-touch-icon"
        href="/static/logo.png.PNG"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel: rgba(20,20,30,.92);
            --drawer: #101019;
            --border: rgba(255,255,255,.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: #9e8cff;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        header {
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            padding:
                calc(8px + env(safe-area-inset-top))
                12px
                8px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,8,13,.60);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .menu-button,
        .header-button {
            min-height: 40px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .menu-button {
            width: 40px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-button {
            padding: 8px 11px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 750;

            min-width: 0;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;
            object-fit: cover;

            box-shadow:
                0 0 20px
                rgba(117,92,255,.45);

            flex-shrink: 0;
        }

        .brand-label {
            min-width: 0;
        }

        .online {
            margin-top: 2px;
            font-size: 11px;
            color: #79ffac;
        }

        .header-actions {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;
            overflow-y: auto;

            padding:
                18px
                16px
                20px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;

            width: 100%;
            max-width: 540px;

            padding:
                10px 20px 20px;

            text-align: center;
        }

        .assistant-character-wrap {
            position: relative;

            width: 205px;
            height: 235px;

            margin:
                0 auto 6px;
        }

        .assistant-character {
            position: relative;
            z-index: 3;

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(117,92,255,.50)
                );

            animation:
                characterFloat
                3.8s
                ease-in-out
                infinite;
        }

        .assistant-character.speaking {
            animation:
                characterTalk
                .28s
                ease-in-out
                infinite
                alternate;
        }

        .assistant-glow {
            position: absolute;
            z-index: 1;

            left: 50%;
            bottom: 10px;

            width: 145px;
            height: 38px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(117,92,255,.30);

            filter:
                blur(18px);
        }

        .character-bubble {
            position: absolute;
            z-index: 5;

            top: 5px;
            right: -35px;

            max-width: 165px;

            padding: 9px 12px;

            border:
                1px solid var(--border);

            border-radius:
                15px 15px 15px 4px;

            background:
                rgba(23,23,36,.92);

            font-size: 12px;

            opacity: 0;

            transition: .25s;
        }

        .character-bubble.show {
            opacity: 1;
        }

        @keyframes characterFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes characterTalk {
            from {
                transform:
                    translateY(-2px)
                    scale(1);
            }

            to {
                transform:
                    translateY(-7px)
                    scale(1.025);
            }
        }

        .welcome h1 {
            margin-bottom: 8px;
            font-size: 34px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .features {
            margin-top: 18px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 8px;
        }

        .feature {
            padding: 7px 11px;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background:
                rgba(255,255,255,.055);

            color: #b7b7c5;

            font-size: 12px;
        }

        .feature-link {
            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.22),
                    rgba(162,108,255,.15)
                );

            border-color:
                rgba(162,108,255,.38);

            color: white;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;

            border-radius: 19px;

            font-size: 15px;
            line-height: 1.48;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .sources {
            width: 100%;
            margin-top: 9px;
        }

        .sources-title {
            color: #a3a3b3;
            font-size: 11px;
            margin-bottom: 7px;
        }

        .source-card {
            display: flex;
            align-items: center;

            gap: 10px;

            width: 100%;

            padding: 9px 11px;
            margin-bottom: 7px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            background:
                rgba(255,255,255,.045);

            color: white;

            text-decoration: none;
        }

        .source-icon {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background:
                rgba(117,92,255,.16);
        }

        .source-host {
            font-size: 12px;
            font-weight: 650;
        }

        .source-url {
            margin-top: 2px;

            color: #828291;

            font-size: 9px;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-card {
            display: flex;
            align-items: center;

            gap: 10px;

            max-width: 290px;

            padding: 12px 14px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background:
                rgba(255,255,255,.06);
        }

        .file-icon {
            font-size: 27px;
        }

        .speak-message {
            margin-top: 5px;

            border: none;
            background: transparent;

            color: #9e9eae;

            font-size: 17px;
        }

        .recording-bar {
            display: none;

            justify-content: center;

            padding: 8px;

            color: #ff8294;
        }

        .attachment-preview-area {
            display: none;

            padding:
                8px
                14px
                0;
        }

        .preview-card {
            position: relative;
            width: fit-content;
        }

        #imagePreview {
            display: none;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 16px;
        }

        #documentPreview {
            display: none;

            gap: 9px;

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.06);
        }

        .remove-attachment {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 25px;
            height: 25px;

            border: none;
            border-radius: 50%;

            color: white;
            background: #353542;
        }

        .input-area {
            flex-shrink: 0;

            padding:
                8px
                12px
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 6px;

            padding: 7px;

            border:
                1px solid rgba(255,255,255,.11);

            border-radius: 22px;

            background:
                rgba(24,24,35,.97);
        }

        textarea {
            flex: 1;

            min-height: 42px;
            max-height: 130px;

            padding: 11px 6px;

            border: none;
            outline: none;

            resize: none;

            background: transparent;
            color: white;

            font-size: 16px;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;
            border-radius: 14px;

            font-size: 19px;
        }

        .attach,
        .mic {
            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send.stop {
            background: var(--danger);
        }

        .input-note {
            margin-top: 6px;

            text-align: center;

            color: #5f5f6b;

            font-size: 10px;
        }

        #fileInput {
            display: none;
        }

        .overlay {
            position: fixed;

            inset: 0;

            z-index: 90;

            opacity: 0;

            pointer-events: none;

            background:
                rgba(0,0,0,.55);
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            z-index: 100;

            width:
                min(86vw,340px);

            padding: 20px 12px;

            display: flex;
            flex-direction: column;

            background: var(--drawer);

            transform:
                translateX(-105%);

            transition: .22s;
        }

        .drawer.open {
            transform:
                translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .drawer-new {
            padding: 12px;
            margin-bottom: 12px;

            border:
                1px solid var(--border);

            border-radius: 14px;

            background:
                rgba(117,92,255,.20);

            color: white;
        }

        #chatList {
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;

            margin-bottom: 6px;
        }

        .history-open {
            flex: 1;

            padding: 9px;

            border: none;

            background: transparent;
            color: white;

            text-align: left;
        }

        .history-date {
            color: var(--muted);
            font-size: 10px;
        }

        .history-delete {
            border: none;
            background: transparent;
        }

        @media (max-width: 600px) {
            .new-chat-text {
                display: none;
            }

            .assistant-character-wrap {
                width: 180px;
                height: 205px;
            }

            .welcome h1 {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="header-left">

            <button
                class="menu-button"
                onclick="openDrawer()"
            >
                ☰
            </button>

            <div class="brand">

                <img
                    class="mini-logo"
                    src="/static/logo.png.PNG"
                >

                <div class="brand-label">

                    Wiens AI

                    <div class="online">
                        ● AI Online
                    </div>

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                id="speakerButton"
                class="header-button speaker-on"
                onclick="toggleSpeech()"
            >
                🔊
            </button>

            <button
                class="header-button"
                onclick="newChat()"
            >
                ＋

                <span class="new-chat-text">
                    Новый чат
                </span>
            </button>

        </div>

    </header>


    <main id="chat"></main>


    <div
        class="recording-bar"
        id="recordingBar"
    >
        <span id="recordingText">
            Запись…
        </span>
    </div>


    <div
        class="attachment-preview-area"
        id="attachmentPreviewArea"
    >

        <div class="preview-card">

            <img id="imagePreview">

            <div id="documentPreview">

                <span id="documentPreviewIcon">
                    📄
                </span>

                <span id="documentPreviewName"></span>

            </div>

            <button
                class="remove-attachment"
                onclick="removeSelectedAttachment()"
            >
                ×
            </button>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-button attach"
                onclick="fileInput.click()"
            >
                ＋
            </button>


            <input
                id="fileInput"
                type="file"
                accept="image/*,.pdf,.docx,.txt"
            >


            <textarea
                id="messageInput"
                placeholder="Сообщение Wiens AI..."
            ></textarea>


            <button
                class="icon-button mic"
                id="micButton"
                onclick="toggleRecording()"
            >
                🎙️
            </button>


            <button
                class="icon-button send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="input-note">
            Wiens AI может допускать ошибки
        </div>

    </div>

</div>


<div
    class="overlay"
    id="overlay"
    onclick="closeDrawer()"
></div>


<aside
    class="drawer"
    id="drawer"
>

    <div class="drawer-header">

        <h2>
            Чаты
        </h2>

        <button
            onclick="closeDrawer()"
        >
            ×
        </button>

    </div>


    <button
        class="drawer-new"
        onclick="newChat()"
    >
        ＋ Новый чат
    </button>


    <div id="chatList"></div>

</aside>


<script>

const STORAGE_KEY =
    "wiens_ai_chats_v1";

const ACTIVE_CHAT_KEY =
    "wiens_ai_active_chat_v1";


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const recordingBar =
    document.getElementById("recordingBar");

const recordingText =
    document.getElementById("recordingText");

const speakerButton =
    document.getElementById("speakerButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreviewArea =
    document.getElementById(
        "attachmentPreviewArea"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const documentPreview =
    document.getElementById(
        "documentPreview"
    );

const documentPreviewIcon =
    document.getElementById(
        "documentPreviewIcon"
    );

const documentPreviewName =
    document.getElementById(
        "documentPreviewName"
    );

const drawer =
    document.getElementById(
        "drawer"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const chatList =
    document.getElementById(
        "chatList"
    );


let chats = [];

let activeChatId = null;

let history = [];

let selectedFile = null;

let selectedFileType = null;

let selectedImageURL = null;

let mediaRecorder = null;

let audioChunks = [];

let recording = false;

let speechEnabled = true;

let streamController = null;

let isStreaming = false;


function createId() {

    return (
        Date.now().toString(36)
        +
        Math.random()
        .toString(36)
        .slice(2)
    );
}


function createEmptyChat() {

    const now =
        new Date()
        .toISOString();

    return {
        id:
            createId(),

        title:
            "Новый чат",

        createdAt:
            now,

        updatedAt:
            now,

        history:
            [],

        uiMessages:
            []
    };
}


function normalizeChat(item) {

    if (!item.history) {
        item.history = [];
    }

    if (!item.uiMessages) {
        item.uiMessages = [];
    }

    if (!item.title) {
        item.title =
            "Новый чат";
    }

    return item;
}


function getActiveChat() {

    return chats.find(
        item =>
            item.id
            === activeChatId
    );
}


function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

    localStorage.setItem(
        ACTIVE_CHAT_KEY,
        activeChatId || ""
    );
}


function saveActiveChat() {

    const current =
        getActiveChat();

    if (!current) {
        return;
    }

    normalizeChat(current);

    current.history =
        history.slice();

    current.updatedAt =
        new Date()
        .toISOString();

    const first =
        current.uiMessages.find(
            item =>
                item.role
                === "user"
        );

    if (
        first
        &&
        first.text
    ) {

        current.title =
            first.text.slice(
                0,
                35
            );
    }

    saveChats();
    renderChatList();
}


function loadChats() {

    try {

        const saved =
            JSON.parse(
                localStorage
                .getItem(
                    STORAGE_KEY
                )
                ||
                "[]"
            );

        chats =
            Array.isArray(saved)
            ?
            saved.map(
                normalizeChat
            )
            :
            [];

    } catch {

        chats = [];
    }


    const savedId =
        localStorage
        .getItem(
            ACTIVE_CHAT_KEY
        );


    if (
        savedId
        &&
        chats.some(
            item =>
                item.id
                === savedId
        )
    ) {

        activeChatId =
            savedId;

    } else if (
        chats.length
    ) {

        activeChatId =
            chats[0].id;

    } else {

        const fresh =
            createEmptyChat();

        chats.push(fresh);

        activeChatId =
            fresh.id;
    }


    const current =
        getActiveChat();

    history =
        current
        ?
        current.history
        :
        [];


    renderCurrentChat();
    renderChatList();
}


function welcomeHtml() {

    return `

        <div class="welcome">

            <div
                class="assistant-character-wrap"
            >

                <div
                    class="character-bubble"
                    id="characterBubble"
                >
                    Привет! Я Wiens AI 👋
                </div>

                <img
                    class="assistant-character"
                    id="assistantCharacter"
                    src="/static/assistant-boy.png.PNG"
                    onclick="characterGreeting()"
                >

                <div
                    class="assistant-glow"
                ></div>

            </div>


            <h1>
                Wiens AI
            </h1>


            <p>
                Напишите, скажите голосом
                или отправьте файл.
            </p>


            <div class="features">

                <a
                    class="feature feature-link"
                    href="/static/freefire-v7.html"
                >
                    🎯 Free Fire Lab v7
                </a>

                <div class="feature">
                    ⚡ Streaming
                </div>

                <div class="feature">
                    🌐 Internet
                </div>

                <div class="feature">
                    📷 Vision
                </div>

                <div class="feature">
                    📄 PDF
                </div>

                <div class="feature">
                    📝 DOCX
                </div>

                <div class="feature">
                    📃 TXT
                </div>

                <div class="feature">
                    🎙️ Voice
                </div>

                <div class="feature">
                    🔗 Sources
                </div>

            </div>

        </div>
    `;
}


function removeWelcome() {

    const welcome =
        document.querySelector(
            ".welcome"
        );

    if (welcome) {
        welcome.remove();
    }
}


function characterGreeting() {

    speakText(
        "Привет! Я Wiens AI. Чем могу помочь?"
    );
}


function setCharacterSpeaking(
    state
) {

    const character =
        document.getElementById(
            "assistantCharacter"
        );

    if (!character) {
        return;
    }

    character.classList.toggle(
        "speaking",
        state
    );
}


function extractUrls(text) {

    return [
        ...new Set(
            String(text)
            .match(
                /https?:\/\/[^\s<>"')\]}]+/gi
            )
            ||
            []
        )
    ];
}


function addSources(
    row,
    text
) {

    const urls =
        extractUrls(text);

    if (!urls.length) {
        return;
    }

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "sources";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "sources-title";

    title.textContent =
        "Источники";

    wrapper.appendChild(
        title
    );


    urls
    .slice(0,5)
    .forEach(
        url => {

            const card =
                document.createElement(

        current

    current.uiMessages.push({

    saveActiveChat();

function newChat() {

    const current =
        getActiveChat();

    if (
        current
        &&
        current.uiMessages
        &&
        current.uiMessages.length === 0
    ) {

        closeDrawer();
        return;
    }


    const fresh =
        createEmptyChat();

    chats.unshift(
        fresh
    );

    activeChatId =
        fresh.id;

    history =
        [];

    saveChats();

    renderCurrentChat();

    renderChatList();

    closeDrawer();
}


function deleteChat(id) {

    if (
        !confirm(
            "Удалить этот чат?"
        )
    ) {
        return;
    }


    chats =
        chats.filter(
            item =>
                item.id
                !== id
        );

    if (!chats.length) {

        chats.push(
            createEmptyChat()
        );
    }

    activeChatId =
        chats[0].id;

    history =
        chats[0].history
        ||
        [];

    saveChats();

    renderCurrentChat();

    renderChatList();
}


function getDocumentType(file) {

    const name =
        file.name
        .toLowerCase();

    if (
        file.type
        .startsWith(
            "image/"
        )
    ) {
        return "image";
    }

    if (
        name.endsWith(
            ".pdf"
        )
    ) {
        return "pdf";
    }

    if (
        name.endsWith(
            ".docx"
        )
    ) {
        return "docx";
    }

    if (
        name.endsWith(
            ".txt"
        )
    ) {
        return "txt";
    }

    return null;
}

function shouldUseWebSearch(text) {

        "сегодня",
        "сейчас",
        "новости",
        "погода",
        "цена",
        "найди",
        "поищи",
        "интернет",
        "актуальн",
        "today",
        "latest",
        "news",
        "weather",
        "search",
        "heute",
        "aktuell",
        "wetter"
    ];

    return words.some(
        word =>
            value.includes(
                word
            )
    );
}

async function sendMessage() {

    if (
        isStreaming
    ) {

        stopGeneration();

        return;
    }


    const text =
        input.value.trim();


    if (
        !text
        &&
        !selectedFile
    ) {
        return;
    }


    if (
        selectedFileType
        === "image"
    ) {

        await sendImage(
            text
        );

        return;
    }


    if (
        selectedFileType
    ) {

        await sendDocument(
            text
        );

        return;
    }


    addTextMessage(
        text,
        "user"
    );

    remember(
        "user",
        "text",
        text
    );

    input.value =
        "";


    if (
        shouldUseWebSearch(
            text
        )
    ) {

        const thinking =
            addTextMessage(
                "🌐 Wiens AI ищет в интернете…",
                "assistant thinking"
            );


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    text,

                                history:
                                    history
                            })
                    }
                );


            const data =
                await response.json();


            thinking.remove();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error
                    ||
                    "Ошибка сервера"
                );
            }


            const answer =
                data.answer
                ||
                "Wiens AI не получил ответ.";


            addTextMessage(
                answer,
                "assistant"
            );


            history.push({
                role:
                    "user",

                content:
                    text
            });


            history.push({
                role:
                    "assistant",

                content:
                    answer
            });


            remember(
                "assistant",
                "text",
                answer
            );


            if (
                speechEnabled
            ) {

                speakText(
                    answer
                );
            }

        } catch(error) {

            thinking.remove();

            addTextMessage(
                "Ошибка соединения: "
                +
                error.message,
                "assistant"
            );
        }


        return;
    }


    removeWelcome();


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row assistant-row";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message assistant";


    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );


    streamController =
        new AbortController();

    setGeneratingState(
        true
    );


    let fullAnswer =
        "";


    try {

        const response =
            await fetch(
                "/api/chat-stream",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text,

                            history:
                                history
                        }),

                    signal:
                        streamController.signal
                }
            );


        if (
            !response.ok
            ||
            !response.body
        ) {

            throw new Error(
                "Не удалось получить ответ."
            );
        }


        const reader =
            response.body
            .getReader();

        const decoder =
            new TextDecoder();


        while (true) {

            const result =
                await reader.read();

            if (
                result.done
            ) {
                break;
            }

            fullAnswer +=
                decoder.decode(
                    result.value,
                    {
                        stream: true
                    }
                );

            bubble.textContent =
                fullAnswer;

            chat.scrollTop =
                chat.scrollHeight;
        }


        if (
            fullAnswer.trim()
        ) {

            history.push({
                role:
                    "user",

                content:
                    text
            });


            history.push({
                role:
                    "assistant",

                content:
                    fullAnswer
            });


            remember(
                "assistant",
                "text",
                fullAnswer
            );


            if (
                speechEnabled
            ) {

                speakText(
                    fullAnswer
                );
            }
        }

    } catch(error) {

        if (
            error.name
            === "AbortError"
        ) {

            if (
                fullAnswer.trim()
            ) {

                history.push({
                    role:
                        "user",

                    content:
                        text
                });


                history.push({
                    role:
                        "assistant",

                    content:
                        fullAnswer
                });


                remember(
                    "assistant",
                    "text",
                    fullAnswer
                );
            }

        } else {

            bubble.textContent =
                "Ошибка получения ответа.";
        }

    } finally {

        streamController =
            null;

        setGeneratingState(
            false
        );
    }
}

function chooseAudioMimeType() {

    const types = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
    ];


    for (
        const type of types
    ) {

        if (
            window.MediaRecorder
            &&
            MediaRecorder.isTypeSupported
            &&
            MediaRecorder.isTypeSupported(
                type
            )
        ) {

            return type;
        }
    }


    return "";
}


async function toggleRecording() {

    if (
        recording
    ) {

        mediaRecorder.stop();

        return;
    }


    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio: true
            });


        const mimeType =
            chooseAudioMimeType();


        mediaRecorder =
            mimeType
            ?
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        mimeType
                }
            )
            :
            new MediaRecorder(
                stream
            );


        audioChunks =
            [];


        mediaRecorder
        .ondataavailable =
            event => {

                if (
                    event.data
                    &&
                    event.data.size
                    >
                    0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder
        .onstop =
            async () => {

                recording =
                    false;

                recordingBar.style.display =
                    "none";


                const actualType =
                    mediaRecorder.mimeType
                    ||
                    mimeType
                    ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                actualType
                        }
                    );


                let filename =
                    "voice.webm";


                if (
                    actualType.includes(
                        "mp4"
                    )
                ) {

                    filename =
                        "voice.mp4";

                } else if (
                    actualType.includes(
                        "ogg"
                    )
                ) {

                    filename =
                        "voice.ogg";
                }


                const form =
                    new FormData();


                form.append(
                    "audio",
                    blob,
                    filename
                );


                try {

                    recordingText.textContent =
                        "Распознаю…";

                    recordingBar.style.display =
                        "flex";


                    const response =
                        await fetch(
                            "/api/transcribe",
                            {
                                method:
                                    "POST",

                                body:
                                    form
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            data.error
                            ||
                            "Ошибка распознавания."
                        );
                    }


                    input.value =
                        data.text
                        ||
                        "";

                } catch(error) {

                    alert(
                        "Ошибка голосового сообщения: "
                        +
                        error.message
                    );

                } finally {

                    recordingBar.style.display =
                        "none";

                    recordingText.textContent =
                        "Запись…";


                    stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );
                }
            };


        mediaRecorder.start();

        recording =
            true;

        recordingText.textContent =
            "Запись…";

        recordingBar.style.display =
            "flex";

    } catch(error) {

        alert(
            "Не удалось включить микрофон: "
            +
            error.message
        );
    }
}


function speakText(text) {

    if (
        !window
        .speechSynthesis
    ) {
        return;
    }


    speechSynthesis.cancel();


    const clean =
        String(text)
        .replace(
            /https?:\/\/\S+/g,
            ""
        );


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    if (
        /[А-Яа-яЁё]/
        .test(clean)
    ) {

        utterance.lang =
            "ru-RU";

    } else {

        utterance.lang =
            "de-DE";
    }


    utterance.rate =
        .96;

    utterance.pitch =
        .95;


    utterance.onstart =
        () =>
            setCharacterSpeaking(
                true
            );


    utterance.onend =
        () =>
            setCharacterSpeaking(
                false
            );


    utterance.onerror =
        () =>
            setCharacterSpeaking(
                false
            );


    speechSynthesis.speak(
        utterance
    );
}

}
