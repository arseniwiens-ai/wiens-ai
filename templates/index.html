<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel: rgba(20, 20, 30, 0.92);
            --panel2: rgba(14, 14, 23, 0.98);
            --border: rgba(255,255,255,0.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        header {
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(8px + env(safe-area-inset-top))
                12px
                8px;

            border-bottom: 1px solid var(--border);

            background: rgba(7,8,13,0.60);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-button {
            width: 40px;
            height: 40px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: rgba(255,255,255,0.06);
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 750;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;
            object-fit: cover;

            box-shadow:
                0 0 20px rgba(117,92,255,0.45);
        }

        .online {
            font-size: 11px;
            color: #79ffac;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .header-button {
            border: 1px solid var(--border);

            background: rgba(255,255,255,0.06);
            color: white;

            min-height: 40px;
            padding: 8px 11px;

            border-radius: 12px;

            cursor: pointer;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;
            overflow-y: auto;

            padding: 25px 16px 20px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;
            text-align: center;

            max-width: 520px;
            padding: 20px;
        }

        .hero-logo {
            width: 115px;
            height: 115px;

            border-radius: 27px;

            object-fit: cover;

            box-shadow:
                0 0 35px rgba(117,92,255,.38),
                0 18px 50px rgba(0,0,0,.4);

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 34px;
            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.5;
            font-size: 15px;
        }

        .features {
            margin-top: 20px;

            display: flex;
            justify-content: center;

            flex-wrap: wrap;
            gap: 8px;
        }

        .feature {
            background: rgba(255,255,255,.055);

            border: 1px solid var(--border);
            border-radius: 20px;

            padding: 7px 11px;

            color: #b7b7c5;
            font-size: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;

            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;

            border-radius: 19px;

            line-height: 1.45;
            font-size: 15px;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);

            border: 1px solid var(--border);

            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .chat-image {
            display: block;

            max-width: min(290px, 75vw);
            max-height: 360px;

            object-fit: contain;

            border-radius: 17px;

            margin-bottom: 7px;

            border: 1px solid var(--border);
        }

        .saved-image-placeholder {
            width: 210px;

            padding: 25px 15px;

            margin-bottom: 7px;

            border-radius: 17px;

            border: 1px solid var(--border);

            background: rgba(255,255,255,.05);

            text-align: center;

            color: var(--muted);

            font-size: 14px;
        }

        .speak-message {
            margin-top: 5px;

            border: none;

            background: transparent;
            color: #9e9eae;

            font-size: 17px;

            cursor: pointer;
        }

        .recording-bar {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 8px;

            color: #ff8294;

            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--danger);

            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
                transform: scale(.8);
            }
        }

        .image-preview-area {
            display: none;

            padding:
                8px
                14px
                0;

            flex-shrink: 0;
        }

        .preview-card {
            position: relative;

            width: 90px;
        }

        #imagePreview {
            display: block;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 16px;

            border: 1px solid var(--border);
        }

            top: -
