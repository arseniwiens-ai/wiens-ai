<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <meta
        name="theme-color"
        content="#07080d"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Wiens AI"
    >

    <link
        rel="apple-touch-icon"
        href="/static/logo.png.PNG"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel: rgba(20,20,30,.92);
            --drawer: #101019;
            --border: rgba(255,255,255,.10);
            --text: #ffffff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);

            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }

        .app {
            height: 100dvh;

            max-width: 900px;

            margin: auto;

            display: flex;

            flex-direction: column;
        }

        header {
            min-height: 70px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            padding:
                calc(
                    8px +
                    env(safe-area-inset-top)
                )
                12px
                8px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,8,13,.60);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }

        .header-left {
            display: flex;

            align-items: center;

            gap: 8px;

            min-width: 0;
        }

        .menu-button,
        .header-button {
            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);

            color: white;

            border-radius: 12px;

            min-height: 40px;
        }

        .menu-button {
            width: 40px;

            font-size: 20px;

            flex-shrink: 0;
        }

        .header-button {
            padding:
                8px 11px;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 19px;

            font-weight: 750;

            min-width: 0;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            object-fit: cover;

            box-shadow:
                0 0 20px
                rgba(117,92,255,.45);

            flex-shrink: 0;
        }

        .brand-label {
            min-width: 0;
        }

        .online {
            font-size: 11px;

            color: #79ffac;

            margin-top: 2px;
        }

        .header-actions {
            display: flex;

            gap: 7px;

            flex-shrink: 0;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding:
                18px
                16px
                20px;

            display: flex;

            flex-direction: column;

            gap: 14px;

            scroll-behavior:
                smooth;
        }

        .welcome {
            margin: auto;

            text-align: center;

            width: 100%;

            max-width: 540px;

            padding:
                10px 20px 20px;
        }

        /* CHARACTER */

        .assistant-character-wrap {
            position: relative;

            width: 210px;
            height: 245px;

            margin:
                0 auto 5px;
        }

        .assistant-character {
            position: relative;

            z-index: 3;

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 17px
                    rgba(117,92,255,.48)
                )
                drop-shadow(
                    0 0 32px
                    rgba(91,92,255,.20)
                );

            animation:
                characterFloat
                3.8s
                ease-in-out
                infinite;

            user-select: none;

            -webkit-user-select: none;
        }

        .assistant-character.speaking {
            animation:
                characterTalk
                .30s
                ease-in-out
                infinite
                alternate;

            filter:
                drop-shadow(
                    0 0 24px
                    rgba(162,108,255,.75)
                )
                drop-shadow(
                    0 0 45px
                    rgba(80,130,255,.38)
                );
        }

        .assistant-glow {
            position: absolute;

            z-index: 1;

            left: 50%;
            bottom: 10px;

            width: 145px;
            height: 38px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(117,92,255,.30);

            filter:
                blur(18px);

            animation:
                glowPulse
                2.2s
                ease-in-out
                infinite;
        }

        .character-bubble {
            position: absolute;

            z-index: 5;

            top: 6px;
            right: -38px;

            max-width: 170px;

            padding:
                9px 12px;

            border:
                1px solid var(--border);

            border-radius:
                15px 15px 15px 4px;

            background:
                rgba(23,23,36,.90);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            font-size: 12px;

            line-height: 1.35;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,.25);

            opacity: 0;

            transform:
                translateY(5px)
                scale(.96);

            pointer-events: none;

            transition:
                .25s;
        }

        .character-bubble.show {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        @keyframes characterFloat {
            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-8px);
            }
        }

        @keyframes characterTalk {
            from {
                transform:
                    translateY(-2px)
                    scale(1);
            }

            to {
                transform:
                    translateY(-7px)
                    scale(1.025);
            }
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: .45;

                transform:
                    translateX(-50%)
                    scale(.94);
            }

            50% {
                opacity: .95;

                transform:
                    translateX(-50%)
                    scale(1.10);
            }
        }

        .welcome h1 {
            font-size: 34px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.5;

            font-size: 15px;
        }

        .features {
            margin-top: 18px;

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;
        }

        .feature {
            background:
                rgba(255,255,255,.055);

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding:
                7px 11px;

            color: #b7b7c5;

            font-size: 12px;
        }

        .message-row {
            display: flex;

            flex-direction: column;

            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;

            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;

            align-items: flex-start;
        }

        .message {
            padding:
                12px 15px;

            border-radius: 19px;

            line-height: 1.45;

            font-size: 15px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius:
                6px;
        }

        .assistant {
            background:
                var(--panel);

            border:
                1px solid var(--border);

            border-bottom-left-radius:
                6px;
        }

        .thinking {
            color: var(--muted);
        }

        .file-card {
            display: flex;

            align-items: center;

            gap: 10px;

            max-width: 290px;

            padding:
                12px 14px;

            margin-bottom: 7px;

            border-radius: 16px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);
        }

        .file-icon {
            font-size: 27px;
        }

        .file-name {
            font-size: 14px;

            overflow-wrap: anywhere;
        }

        .chat-image {
            display: block;

            max-width:
                min(290px,75vw);

            max-height: 360px;

            object-fit: contain;

            border-radius: 17px;

            margin-bottom: 7px;

            border:
                1px solid var(--border);
        }

        .speak-message {
            margin-top: 5px;

            border: none;

            background: transparent;

            color: #9e9eae;

            font-size: 17px;
        }

        .recording-bar {
            display: none;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 8px;

            color: #ff8294;

            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background:
                var(--danger);

            animation:
                pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;

                transform:
                    scale(.8);
            }
        }

        .attachment-preview-area {
            display: none;

            padding:
                8px
                14px
                0;

            flex-shrink: 0;
        }

        .preview-card {
            position: relative;

            width: fit-content;

            max-width: 90%;
        }

        #imagePreview {
            display: none;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 16px;

            border:
                1px solid var(--border);
        }

        #documentPreview {
            display: none;

            align-items: center;

            gap: 9px;

            max-width: 300px;

            padding:
                11px
                38px
                11px
                12px;

            border-radius: 14px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);
        }

        #documentPreviewName {
            font-size: 13px;

            overflow-wrap: anywhere;
        }

        .remove-attachment {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 25px;
            height: 25px;

            border: none;

            border-radius: 50%;

            background:
                #353542;

            color: white;
        }

        .input-area {
            flex-shrink: 0;

            padding:
                8px
                12px
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );

            background:
                linear-gradient(
                    transparent,
                    rgba(7,8,13,.98)
                    25%
                );
        }

        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 6px;

            padding: 7px;

            background:
                rgba(24,24,35,.97);

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 22px;

            box-shadow:
                0 12px 40px
                rgba(0,0,0,.32);
        }

        textarea {
            flex: 1;

            resize: none;

            max-height: 130px;
            min-height: 42px;

            padding:
                11px 6px;

            background:
                transparent;

            border: none;

            outline: none;

            color: white;

            font-size: 16px;
        }

        textarea::placeholder {
            color: #777786;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 14px;

            font-size: 19px;
        }

        .attach,
        .mic {
            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .mic.recording {
            background:
                var(--danger);
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send:disabled {
            opacity: .45;
        }

        .input-note {
            text-align: center;

            color: #5f5f6b;

            font-size: 10px;

            margin-top: 6px;
        }

        #fileInput {
            display: none;
        }

        /* HISTORY */

        .overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            opacity: 0;

            pointer-events: none;

            transition:
                .2s;

            z-index: 90;
        }

        .overlay.open {
            opacity: 1;

            pointer-events: auto;
        }

        .drawer {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width:
                min(86vw,340px);

            padding:
                calc(
                    14px
                    +
                    env(safe-area-inset-top)
                )
                12px
                calc(
                    14px
                    +
                    env(safe-area-inset-bottom)
                );

            background:
                var(--drawer);

            border-right:
                1px solid var(--border);

            transform:
                translateX(-105%);

            transition:
                transform .22s ease;

            z-index: 100;

            display: flex;

            flex-direction: column;
        }

        .drawer.open {
            transform:
                translateX(0);
        }

        .drawer-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }

        .drawer-new {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(162,108,255,.35);

            border-radius: 14px;

            background:
                rgba(117,92,255,.20);

            color: white;
        }

        .drawer-close {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }

        #chatList {
            flex: 1;

            overflow-y: auto;
        }

        .history-item {
            display: flex;

            align-items: center;

            margin-bottom: 6px;

            border-radius: 12px;
        }

        .history-item.active {
            background:
                rgba(117,92,255,.13);
        }

        .history-open {
            flex: 1;

            min-width: 0;

            padding: 9px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;
        }

        .history-title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .history-date {
            color: var(--muted);

            font-size: 10px;

            margin-top: 3px;
        }

        .history-delete {
            width: 36px;

            border: none;

            background: transparent;

            color: white;
        }

        @media (
            max-width: 600px
        ) {
            .new-chat-text {
                display: none;
            }

            .assistant-character-wrap {
                width: 180px;
                height: 210px;
            }

            .character-bubble {
                right: -26px;

                max-width: 145px;

                font-size: 11px;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .brand-label {
                max-width: 95px;

                overflow: hidden;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="header-left">

            <button
                class="menu-button"
                onclick="openDrawer()"
            >
                ☰
            </button>

            <div class="brand">

                <img
                    class="mini-logo"
                    src="/static/logo.png.PNG"
                    alt="Wiens AI"
                >

                <div class="brand-label">

                    Wiens AI

                    <div class="online">
                        ● AI Online
                    </div>

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                id="speakerButton"
                class="header-button speaker-on"
                onclick="toggleSpeech()"
            >
                🔊
            </button>

            <button
                class="header-button"
                onclick="newChat()"
            >
                ＋

                <span class="new-chat-text">
                    Новый чат
                </span>

            </button>

        </div>

    </header>


    <main id="chat"></main>


    <div
        class="recording-bar"
        id="recordingBar"
    >

        <div
            class="recording-dot"
        ></div>

        <span id="recordingText">
            Запись…
        </span>

    </div>


    <div
        class="attachment-preview-area"
        id="attachmentPreviewArea"
    >

        <div class="preview-card">

            <img
                id="imagePreview"
                alt="Preview"
            >

            <div
                id="documentPreview"
            >

                <span id="documentPreviewIcon">
                    📄
                </span>

                <span id="documentPreviewName"></span>

            </div>

            <button
                class="remove-attachment"
                onclick="removeSelectedAttachment()"
            >
                ×
            </button>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-button attach"
                onclick="
                    document
                    .getElementById(
                        'fileInput'
                    )
                    .click()
                "
            >
                ＋
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*,.pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
            >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Сообщение Wiens AI..."
            ></textarea>

            <button
                class="icon-button mic"
                id="micButton"
                onclick="toggleRecording()"
            >
                🎙️
            </button>

            <button
                class="icon-button send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="input-note">
            Wiens AI может допускать ошибки
        </div>

    </div>

</div>


<div
    class="overlay"
    id="overlay"
    onclick="closeDrawer()"
></div>


<aside
    class="drawer"
    id="drawer"
>

    <div class="drawer-header">

        <h2>
            Чаты
        </h2>

        <button
            class="drawer-close"
            onclick="closeDrawer()"
        >
            ×
        </button>

    </div>

    <button
        class="drawer-new"
        onclick="newChat()"
    >
        ＋ Новый чат
    </button>

    <div id="chatList"></div>

</aside>


<script>

const STORAGE_KEY =
    "wiens_ai_chats_v1";

const ACTIVE_CHAT_KEY =
    "wiens_ai_active_chat_v1";

const GREETING_KEY =
    "wiens_ai_greeting_seen";


const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const recordingBar =
    document.getElementById(
        "recordingBar"
    );

const recordingText =
    document.getElementById(
        "recordingText"
    );

const speakerButton =
    document.getElementById(
        "speakerButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const attachmentPreviewArea =
    document.getElementById(
        "attachmentPreviewArea"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const documentPreview =
    document.getElementById(
        "documentPreview"
    );

const documentPreviewIcon =
    document.getElementById(
        "documentPreviewIcon"
    );

const documentPreviewName =
    document.getElementById(
        "documentPreviewName"
    );

const drawer =
    document.getElementById(
        "drawer"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const chatList =
    document.getElementById(
        "chatList"
    );


let chats = [];

let activeChatId =
    null;

let history = [];

let selectedFile =
    null;

let selectedFileType =
    null;

let selectedImageURL =
    null;

let mediaRecorder =
    null;

let audioChunks =
    [];

let recording =
    false;

let speechEnabled =
    true;


function createId() {

    return (
        Date.now()
        .toString(36)
        +
        Math.random()
        .toString(36)
        .slice(2)
    );
}


function createEmptyChat() {

    const now =
        new Date()
        .toISOString();


    return {
        id:
            createId(),

        title:
            "Новый чат",

        createdAt:
            now,

        updatedAt:
            now,

        history:
            [],

        uiMessages:
            []
    };
}


function getActiveChat() {

    return chats.find(
        item =>
            item.id
            === activeChatId
    );
}


function saveChats() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                chats
            )
        );


        localStorage.setItem(
            ACTIVE_CHAT_KEY,
            activeChatId || ""
        );

    } catch (error) {

        console.log(
            "Chat save error",
            error
        );
    }
}


function saveActiveChat() {

    const current =
        getActiveChat();


    if (!current) {
        return;
    }


    current.history =
        history.slice();


    current.updatedAt =
        new Date()
        .toISOString();


    const first =
        current.uiMessages
        .find(
            item =>
                item.role
                === "user"
        );


    if (
        first
        &&
        first.text
    ) {

        current.title =
            first.text
            .slice(
                0,
                35
            );
    }


    saveChats();

    renderChatList();
}


function loadChats() {

    try {

        const saved =
            JSON.parse(
                localStorage
                .getItem(
                    STORAGE_KEY
                )
                ||
                "[]"
            );


        chats =
            Array.isArray(saved)
            ?
            saved
            :
            [];


    } catch (error) {

        chats =
            [];
    }


    const savedId =
        localStorage
        .getItem(
            ACTIVE_CHAT_KEY
        );


    if (
        savedId
        &&
        chats.some(
            item =>
                item.id
                === savedId
        )
    ) {

        activeChatId =
            savedId;


    } else if (
        chats.length
    ) {

        activeChatId =
            chats[0].id;


    } else {

        const fresh =
            createEmptyChat();


        chats.push(
            fresh
        );


        activeChatId =
            fresh.id;
    }


    const current =
        getActiveChat();


    history =
        current
        ?
        (
            current.history
            ||
            []
        )
        :
        [];


    renderCurrentChat();

    renderChatList();


    setTimeout(
        showInitialGreeting,
        600
    );
}

function showInitialGreeting() {

        getActiveChat();

        !== 0
    ) {
        return;
    }


    showCharacterBubble(
        "Привет! Я Wiens AI 👋 Чем могу помочь?"
    );


    /*
      iPhone Safari may block automatic
      speech before the first user action.
      Tapping the character will always
      try the greeting again.
    */

    if (
        sessionStorage
        .getItem(
            GREETING_KEY
        )
    ) {
        return;
    }


    sessionStorage.setItem(
        GREETING_KEY,
        "1"
    );


    setTimeout(
        () => {

            try {

                speakText(
                    "Привет! Я Wiens AI. Чем могу помочь?"

    type,
    text,
    filename = ""
) {

    const current =
        getActiveChat();


    if (!current) {
        return;
    }


    current.uiMessages.push({
        role,
        type,
        text,
        filename
    });


    saveActiveChat();
}


function renderCurrentChat() {

    chat.innerHTML =
        "";


    const current =
        getActiveChat();


    if (
        !current
        ||
        !current.uiMessages
        ||
        current.uiMessages.length
        === 0
    ) {

        chat.innerHTML =
            welcomeHtml();


        return;
    }


    current.uiMessages
    .forEach(
        item => {

            if (
                item.type
                === "image"
            ) {

                addFileCard(
                    "📷",
                    item.filename
                    ||
                    "Изображение",
                    item.text
                );


            } else if (
                item.type
                === "document"
            ) {

                addFileCard(
                    getDocumentIcon(
                        item.filename
                    ),
                    item.filename
                    ||
                    "Документ",
                    item.text
                );


            } else {

                addTextMessage(
                    item.text,
                    item.role
                );
            }
        }
    );
}


function renderChatList() {

        "";


    chats
    .slice()
    .sort(
        (a,b) =>
            new Date(
                b.updatedAt
            )
            -
            new Date(
                a.updatedAt
            )
    )
    .forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "history-item";


            if (
                item.id
                === activeChatId
            ) {

                row.classList.add(
                    "active"
                );
            }


            const open =
                document.createElement(
                    "button"
                );


            open.className =
                "history-open";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "history-title";


            title.textContent =
                item.title
                ||
                "Новый чат";


            const date =
                document.createElement(
                    "div"
                );


            date.className =
                "history-date";


            date.textContent =
                new Date(
                    item.updatedAt
                )
                .toLocaleString(
                    "ru-RU"
                );


            open.appendChild(
                title
            );


            open.appendChild(
                date
            );


            open.onclick =

            const del =

function newChat() {

    saveActiveChat();


    const current =
        getActiveChat();


    if (
        current
        &&
        current.uiMessages
        &&
        current.uiMessages.length
        === 0
    ) {

        closeDrawer();

        renderCurrentChat();

        setTimeout(
            showInitialGreeting,
            100
        );

        return;
    }


    const fresh =
        createEmptyChat();


    chats.unshift(
        fresh
    );


    activeChatId =
        fresh.id;


    history =
        [];


    removeSelectedAttachment();


    saveChats();


    renderCurrentChat();


    renderChatList();


    closeDrawer();

function deleteChat(
    id
) {

    if (
        !confirm(
            "Удалить чат?"
        )
    ) {
        return;
    }


    chats =
        chats.filter(
            item =>
                item.id
                !== id
        );


    if (
        chats.length
        === 0
    ) {

        chats.push(
            createEmptyChat()
        );
    }


    if (
        !chats.some(
            item =>
                item.id
                === activeChatId
        )
    ) {

        activeChatId =
            chats[0].id;
    }


    const current =
        getActiveChat();


    history =
        current
        ?
        (
            current.history
            ||
            []
        )
        :
        [];


    saveChats();


    renderCurrentChat();


    renderChatList();
}


function getDocumentType(
    file
) {

    const name =
        file.name
        .toLowerCase();


    if (
        file.type
        .startsWith(
            "image/"
        )
    ) {

        return "image";
    }


    if (
        name.endsWith(
            ".pdf"
        )
    ) {

        return "pdf";
    }


    if (
        name.endsWith(
            ".docx"
        )
    ) {

        return "docx";
    }


    if (
        name.endsWith(
            ".txt"
        )
    ) {

        return "txt";
    }


    return null;
}


function getDocumentIcon(
    filename
) {

    const name =
        String(
            filename
            ||
            ""
        )
        .toLowerCase();


    if (
        name.endsWith(
            ".docx"
        )
    ) {

        return "📝";
    }


    if (
        name.endsWith(
            ".txt"
        )
    ) {

        return "📃";
    }


    return "📄";
}

function removeSelectedAttachment(
    clearInput = true
) {

    selectedFile =
        null;


    selectedFileType =
        null;


    if (
        selectedImageURL
    ) {

        URL.revokeObjectURL(
            selectedImageURL
        );


        selectedImageURL =
            null;
    }


    imagePreview.src =
        "";


    imagePreview.style.display =
        "none";


    documentPreview.style.display =
        "none";


    attachmentPreviewArea
    .style
    .display =
        "none";


    input.placeholder =

        fileInput.value =
            "";
    }
}


async function sendMessage(
    customText = null
) {

    const text =
        (
            customText !== null
            ?
            customText
            :
            input.value
        )
        .trim();


    if (
        !text
        &&
        !selectedFile
    ) {

        return;
    }


    if (
        selectedFileType
        === "image"
    ) {

        await sendImage(
            text
        );


        return;
    }


    if (
        selectedFileType
        === "pdf"
        ||
        selectedFileType
        === "docx"
        ||
        selectedFileType
        === "txt"
    ) {

        await sendDocument(
            text
        );


        return;
    }


    addTextMessage(
        text,
        "user"
    );


    remember(
        "user",
        "text",
        text
    );


    input.value =
        "";


    input.style.height =
        "auto";


    const thinking =
        addTextMessage(
            "Wiens AI думает…",
            "assistant thinking"
        );


    sendButton.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (
            !response.ok
        ) {

            addTextMessage(
                data.error
                ||
                "Произошла ошибка.",
                "assistant"
            );


            return;
        }


        addTextMessage(
            data.answer,
            "assistant"
        );


        history.push({
            role:
                "user",

            content:
                text
        });


        history.push({
            role:
                "assistant",

            content:
                data.answer
        });


        remember(
            "assistant",
            "text",
            data.answer
        );


        if (
            speechEnabled
        ) {

            speakText(
                data.answer
            );
        }


    } catch (error) {

        thinking.remove();


        addTextMessage(
            "Ошибка соединения.",
            "assistant"
        );


    } finally {

        sendButton.disabled =
            false;


        input.focus();
    }
}

async function toggleRecording() {

    if (
        recording
    ) {

        if (
            mediaRecorder
            &&
            mediaRecorder.state
            !== "inactive"
        ) {

            mediaRecorder.stop();
        }


        return;
    }


    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:
                    true
            });


        let options =
            {};


        if (
            MediaRecorder
            .isTypeSupported(
                "audio/mp4"
            )
        ) {

            options = {
                mimeType:
                    "audio/mp4"
            };


        } else if (
            MediaRecorder
            .isTypeSupported(
                "audio/webm"
            )
        ) {

            options = {
                mimeType:
                    "audio/webm"
            };
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        audioChunks =
            [];


        mediaRecorder
        .ondataavailable =
            event => {

                if (
                    event.data
                    &&
                    event.data.size
                    >
                    0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder
        .onstop =
            async () => {

                recording =
                    false;


                micButton.textContent =
                    "🎙️";


                micButton.classList.remove(
                    "recording"
                );


                recordingBar.style.display =
                    "none";


                stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


                const mime =
                    mediaRecorder.mimeType
                    ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mime
                        }
                    );


                await transcribeAudio(
                    blob,
                    mime
                );
            };


        mediaRecorder.start();


        recording =
            true;


        micButton.textContent =
            "⏹️";


        micButton.classList.add(
            "recording"
        );


        recordingBar.style.display =
            "flex";


        recordingText.textContent =
            "Запись голоса… нажмите ⏹️ для отправки";


    } catch (error) {

        alert(
            "Разрешите доступ к микрофону."
        );
    }
}


async function transcribeAudio(
    blob,
    mime
) {

    recordingBar.style.display =
        "flex";


    recordingText.textContent =
        "Распознаю голос…";


    try {

        const form =
            new FormData();


        form.append(
            "audio",
            blob,
            mime.includes(
                "mp4"
            )
            ?
            "voice.mp4"
            :
            "voice.webm"
        );


        const response =
            await fetch(
                "/api/transcribe",
                {
                    method:
                        "POST",

                    body:
                        form
                }
            );


        const data =
            await response.json();


        recordingBar.style.display =
            "none";


        if (
            !response.ok
        ) {

            addTextMessage(
                data.error
                ||
                "Не удалось распознать голос.",
                "assistant"
            );


            return;
        }


        if (
            data.text
        ) {

            await sendMessage(
                data.text
            );
        }


    } catch (error) {

        recordingBar.style.display =
            "none";


        addTextMessage(
            "Ошибка отправки голосового сообщения.",
            "assistant"
        );
    }
}


function chooseVoice(
    language
) {

    const voices =
        window
        .speechSynthesis
        .getVoices();


    if (
        !voices
        ||
        voices.length
        === 0
    ) {

        return null;
    }


    const prefix =
        language
        .slice(
            0,
            2
        )
        .toLowerCase();


    const matching =
        voices.filter(
            voice =>
                voice.lang
                &&
                voice.lang
                .toLowerCase()
                .startsWith(
                    prefix
                )
        );


    if (
        matching.length
        === 0
    ) {

        return null;
    }


    const preferredWords = [
        "premium",
        "enhanced",
        "siri",
        "milena",
        "katja",
        "anna",
        "daniel"
    ];


    for (
        const keyword
        of preferredWords
    ) {

        const found =
            matching.find(
                voice =>
                    voice.name
                    .toLowerCase()
                    .includes(
                        keyword
                    )
            );


        if (found) {
            return found;
        }
    }


    return matching[0];
}


function speakText(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;
    }


    window
    .speechSynthesis
    .cancel();


    const clean =
        String(
            text
        )
        .replace(
            /https?:\/\/\S+/g,
            ""
        )
        .replace(
            /[*#`]/g,
            ""
        );


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    let language =
        "en-US";


    if (
        /[А-Яа-яЁё]/
        .test(
            clean
        )
    ) {

        language =
            "ru-RU";


    } else if (
        /[äöüßÄÖÜ]/
        .test(
            clean
        )
    ) {

        language =
            "de-DE";
    }


    utterance.lang =
        language;


    const voice =
        chooseVoice(
            language
        );


    if (voice) {

        utterance.voice =
            voice;
    }


    utterance.rate =
        0.96;


    utterance.pitch =
        0.95;


    utterance.onstart =
        function() {

            setCharacterSpeaking(
                true
            );
        };


    utterance.onend =
        function() {

            setCharacterSpeaking(
                false
            );
        };


    utterance.onerror =
        function() {

            setCharacterSpeaking(
                false
            );
        };


    window
    .speechSynthesis
    .speak(
        utterance
    );
}


function toggleSpeech() {

    speechEnabled =
        !speechEnabled;


    speakerButton.textContent =
        speechEnabled
        ?
        "🔊"
        :
        "🔇";


    if (
        speechEnabled
    ) {

        speakerButton.classList.add(
            "speaker-on"
        );


    } else {

        speakerButton.classList.remove(
            "speaker-on"
        );


        window
        .speechSynthesis
        .cancel();


        setCharacterSpeaking(
            false
        );
    }
}


input.addEventListener(

    event => {

        if (
            event.key
            === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();


            sendMessage();
        }
    }
);


input.addEventListener(

        this.style.height =

        this.style.height =

);

    in navigator
) {

    window.addEventListener(

        () => {

            navigator
            .serviceWorker

            )
            .catch(
                error => {

                    console.log(
                        "Service worker error:",
                        error
                    );
                }
            );
        }
    );
}
