<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Wiens AI</title>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#07080d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wiens AI">

    <link
        rel="apple-touch-icon"
        href="/static/logo.png.PNG"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel: rgba(20,20,30,.92);
            --drawer: #101019;
            --border: rgba(255,255,255,.10);
            --text: #fff;
            --muted: #9696a5;
            --purple: #755cff;
            --purple2: #a26cff;
            --danger: #ff4d67;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #25174c 0%,
                    #10101b 32%,
                    #07080d 70%
                );

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            height: 100dvh;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;
        }

        header {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(8px + env(safe-area-inset-top))
                12px
                8px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,8,13,.60);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-button,
        .header-button {
            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);

            color: white;

            border-radius: 12px;

            min-height: 40px;
        }

        .menu-button {
            width: 40px;
            font-size: 20px;
        }

        .header-button {
            padding: 8px 11px;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 9px;

            font-size: 19px;
            font-weight: 750;
        }

        .mini-logo {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            object-fit: cover;

            box-shadow:
                0 0 20px
                rgba(117,92,255,.45);
        }

        .online {
            font-size: 11px;
            color: #79ffac;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .speaker-on {
            background:
                linear-gradient(
                    135deg,
                    rgba(117,92,255,.35),
                    rgba(162,108,255,.25)
                );
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding:
                25px 16px 20px;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .welcome {
            margin: auto;

            text-align: center;

            max-width: 520px;

            padding: 20px;
        }

        .hero-logo {
            width: 110px;
            height: 110px;

            border-radius: 27px;

            object-fit: cover;

            box-shadow:
                0 0 35px
                rgba(117,92,255,.38);

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 34px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.5;
        }

        .features {
            margin-top: 20px;

            display: flex;
            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;
        }

        .feature {
            background:
                rgba(255,255,255,.055);

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 7px 11px;

            color: #b7b7c5;

            font-size: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;

            max-width: 90%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .assistant-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;

            border-radius: 19px;

            line-height: 1.45;

            font-size: 15px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .user {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            border-bottom-right-radius: 6px;
        }

        .assistant {
            background: var(--panel);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 6px;
        }

        .thinking {
            color: var(--muted);
        }

        .chat-image {
            display: block;

            max-width:
                min(290px,75vw);

            max-height: 360px;

            object-fit: contain;

            border-radius: 17px;

            margin-bottom: 7px;

            border:
                1px solid var(--border);
        }

        .file-card {
            display: flex;
            align-items: center;

            gap: 10px;

            max-width: 290px;

            padding: 12px 14px;

            margin-bottom: 7px;

            border-radius: 16px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);
        }

        .file-icon {
            font-size: 26px;
        }

        .file-name {
            font-size: 14px;

            overflow-wrap: anywhere;
        }

        .speak-message {
            border: none;

            background: transparent;

            color: #9e9eae;

            font-size: 17px;

            margin-top: 5px;
        }

        .recording-bar {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 8px;

            color: #ff8294;

            font-size: 13px;
        }

        .recording-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--danger);

            animation:
                pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
            }
        }

        .attachment-preview-area {
            display: none;

            padding:
                8px
                14px
                0;
        }

        .preview-card {
            position: relative;

            width: fit-content;

            max-width: 90%;
        }

        #imagePreview {
            display: none;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 16px;

            border:
                1px solid var(--border);
        }

        #pdfPreview {
            display: none;

            align-items: center;

            gap: 9px;

            max-width: 280px;

            padding:
                11px 38px 11px 12px;

            border-radius: 14px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.06);
        }

        #pdfPreviewName {
            font-size: 13px;

            overflow-wrap: anywhere;
        }

        .remove-attachment {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 25px;
            height: 25px;

            border: none;

            border-radius: 50%;

            background: #353542;

            color: white;
        }

        .input-area {
            padding:
                8px
                12px
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );
        }

        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 6px;

            padding: 7px;

            background:
                rgba(24,24,35,.97);

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 22px;
        }

        textarea {
            flex: 1;

            resize: none;

            max-height: 130px;
            min-height: 42px;

            padding: 11px 6px;

            background: transparent;

            border: none;
            outline: none;

            color: white;

            font-size: 16px;
        }

        textarea::placeholder {
            color: #777786;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 14px;

            font-size: 19px;
        }

        .attach,
        .mic {
            background:
                rgba(255,255,255,.06);

            color: white;
        }

        .mic.recording {
            background:
                var(--danger);
        }

        .send {
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            color: white;
        }

        .send:disabled {
            opacity: .45;
        }

        .input-note {
            text-align: center;

            color: #5f5f6b;

            font-size: 10px;

            margin-top: 6px;
        }

        #fileInput {
            display: none;
        }

        .overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            opacity: 0;

            pointer-events: none;

            transition: .2s;

            z-index: 90;
        }

        .overlay.open {
            opacity: 1;

            pointer-events: auto;
        }

        .drawer {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width:
                min(86vw,340px);

            padding:
                calc(
                    14px
                    +
                    env(safe-area-inset-top)
                )
                12px
                calc(
                    14px
                    +
                    env(safe-area-inset-bottom)
                );

            background:
                var(--drawer);

            border-right:
                1px solid var(--border);

            transform:
                translateX(-105%);

            transition:
                .22s;

            z-index: 100;

            display: flex;

            flex-direction: column;
        }

        .drawer.open {
            transform:
                translateX(0);
        }

        .drawer-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .drawer-new {
            padding: 12px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(162,108,255,.35);

            border-radius: 14px;

            background:
                rgba(117,92,255,.20);

            color: white;
        }

        #chatList {
            overflow-y: auto;
        }

        .history-item {
            display: flex;

            align-items: center;

            margin-bottom: 6px;

            border-radius: 12px;
        }

        .history-item.active {
            background:
                rgba(117,92,255,.13);
        }

        .history-open {
            flex: 1;

            padding: 9px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;
        }

        .history-title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .history-date {
            font-size: 10px;

            color: var(--muted);

            margin-top: 3px;
        }

        .history-delete {
            width: 36px;

            border: none;

            background: transparent;

            color: white;
        }

        .drawer-close {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.06);

            color: white;
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="header-left">

            <button
                class="menu-button"
                onclick="openDrawer()"
            >
                ☰
            </button>

            <div class="brand">

                <img
                    class="mini-logo"
                    src="/static/logo.png.PNG"
                >

                <div>
                    Wiens AI

                    <div class="online">
                        ● AI Online
                    </div>

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                id="speakerButton"
                class="header-button speaker-on"
                onclick="toggleSpeech()"
            >
                🔊
            </button>

            <button
                class="header-button"
                onclick="newChat()"
            >
                ＋ Новый чат
            </button>

        </div>

    </header>


    <main id="chat"></main>


    <div
        class="recording-bar"
        id="recordingBar"
    >

        <div
            class="recording-dot"
        ></div>

        <span id="recordingText">
            Запись…
        </span>

    </div>


    <div
        class="attachment-preview-area"
        id="attachmentPreviewArea"
    >

        <div class="preview-card">

            <img
                id="imagePreview"
            >

            <div id="pdfPreview">

                <span>
                    📄
                </span>

                <span id="pdfPreviewName"></span>

            </div>

            <button
                class="remove-attachment"
                onclick="removeSelectedAttachment()"
            >
                ×
            </button>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-button attach"
                onclick="
                    document
                    .getElementById(
                        'fileInput'
                    )
                    .click()
                "
            >
                ＋
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*,.pdf,application/pdf"
            >

            <textarea
                id="messageInput"
                placeholder="Сообщение Wiens AI..."
            ></textarea>

            <button
                class="icon-button mic"
                id="micButton"
                onclick="toggleRecording()"
            >
                🎙️
            </button>

            <button
                class="icon-button send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="input-note">
            Wiens AI может допускать ошибки
        </div>

    </div>

</div>


<div
    class="overlay"
    id="overlay"
    onclick="closeDrawer()"
></div>


<aside
    class="drawer"
    id="drawer"
>

    <div class="drawer-header">

        <h2>
            Чаты
        </h2>

        <button
            class="drawer-close"
            onclick="closeDrawer()"
        >
            ×
        </button>

    </div>

    <button
        class="drawer-new"
        onclick="newChat()"
    >
        ＋ Новый чат
    </button>

    <div id="chatList"></div>

</aside>


<script>

const STORAGE_KEY =
    "wiens_ai_chats_v1";

const ACTIVE_CHAT_KEY =
    "wiens_ai_active_chat_v1";


const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const recordingBar =
    document.getElementById(
        "recordingBar"
    );

const recordingText =
    document.getElementById(
        "recordingText"
    );

const speakerButton =
    document.getElementById(
        "speakerButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const attachmentPreviewArea =
    document.getElementById(
        "attachmentPreviewArea"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const pdfPreview =
    document.getElementById(
        "pdfPreview"
    );

const pdfPreviewName =
    document.getElementById(
        "pdfPreviewName"
    );

const drawer =
    document.getElementById(
        "drawer"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const chatList =
    document.getElementById(
        "chatList"
    );


let chats = [];

let activeChatId =
    null;

let history = [];

let selectedFile =
    null;

let selectedFileType =
    null;

let selectedImageURL =
    null;

let mediaRecorder =
    null;

let audioChunks =
    [];

let recording =
    false;

let speechEnabled =
    true;


function createId() {

    return (
        Date.now()
        .toString(36)
        +
        Math.random()
        .toString(36)
        .slice(2)
    );
}


function createEmptyChat() {

    const now =
        new Date()
        .toISOString();


    return {
        id:
            createId(),

        title:
            "Новый чат",

        createdAt:
            now,

        updatedAt:
            now,

        history:
            [],

        uiMessages:
            []
    };
}


function getActiveChat() {

    return chats.find(
        item =>
            item.id
            === activeChatId
    );
}


function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            chats
        )
    );


    localStorage.setItem(
        ACTIVE_CHAT_KEY,
        activeChatId
        ||
        ""
    );
}


function saveActiveChat() {

    const current =
        getActiveChat();


    if (!current) {
        return;
    }


    current.history =
        history.slice();


    current.updatedAt =
        new Date()
        .toISOString();


    const first =
        current.uiMessages
        .find(
            item =>
                item.role
                === "user"
        );


    if (
        first
        &&
        first.text
    ) {

        current.title =
            first.text
            .slice(
                0,
                35
            );
    }


    saveChats();

    renderChatList();
}


function loadChats() {

    try {

        chats =
            JSON.parse(
                localStorage
                .getItem(
                    STORAGE_KEY
                )
                ||
                "[]"
            );


    } catch {

        chats =
            [];
    }


    const saved =
        localStorage
        .getItem(
            ACTIVE_CHAT_KEY
        );


    if (
        saved
        &&
        chats.some(
            item =>
                item.id
                === saved
        )
    ) {

        activeChatId =
            saved;


    } else if (
        chats.length
    ) {

        activeChatId =
            chats[0].id;


    } else {

        const fresh =
            createEmptyChat();


        chats.push(
            fresh
        );


        activeChatId =
            fresh.id;
    }


    const current =
        getActiveChat();


    history =
        current
        ?
        (
            current.history
            ||
            []
        )
        :
        [];


    renderCurrentChat();

    renderChatList();
}


function welcomeHtml() {

    return `

        <div class="welcome">

            <img
                class="hero-logo"
                src="/static/logo.png.PNG"
            >

            <h1>
                Wiens AI
            </h1>

            <p>
                Напишите, скажите голосом
                или отправьте фото / PDF.
            </p>

            <div class="features">

                <div class="feature">
                    🧠 AI
                </div>

                <div class="feature">
                    🌐 Internet
                </div>

                <div class="feature">
                    📷 Vision
                </div>

                <div class="feature">
                    📄 PDF
                </div>

                <div class="feature">
                    🎙️ Voice
                </div>

                <div class="feature">
                    💾 History
                </div>

            </div>

        </div>
    `;
}


function removeWelcome() {

    const welcome =
        document
        .querySelector(
            ".welcome"
        );


    if (welcome) {

        welcome.remove();
    }
}


function addTextMessage(
    text,
    role
) {

    removeWelcome();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row "
        +
        (
            role
            === "user"
            ?
            "user-row"
            :
            "assistant-row"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message "
        +
        role;


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    if (
        role
        === "assistant"
        &&
        !bubble.classList
        .contains(
            "thinking"
        )
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "speak-message";


        button.textContent =
            "🔊";


        button.onclick =
            () =>
                speakText(
                    text
                );


        row.appendChild(
            button
        );
    }


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;


    return row;
}


function addFileCard(
    icon,
    filename,
    text
) {

    removeWelcome();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row user-row";


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "file-card";


    const iconBox =
        document.createElement(
            "div"
        );


    iconBox.className =
        "file-icon";


    iconBox.textContent =
        icon;


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "file-name";


    name.textContent =
        filename;


    card.appendChild(
        iconBox
    );


    card.appendChild(
        name
    );


    row.appendChild(
        card
    );


    if (text) {

        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "message user";


        bubble.textContent =
            text;


        row.appendChild(
            bubble
        );
    }


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;
}


function remember(
    role,
    type,
    text,
    filename = ""
) {

    const current =
        getActiveChat();


    current.uiMessages.push({
        role,
        type,
        text,
        filename
    });


    saveActiveChat();
}


function renderCurrentChat() {

    chat.innerHTML =
        "";


    const current =
        getActiveChat();


    if (
        !current
        ||
        !current.uiMessages
        ||
        current.uiMessages.length
        === 0
    ) {

        chat.innerHTML =
            welcomeHtml();


        return;
    }


    current.uiMessages
    .forEach(
        item => {

            if (
                item.type
                === "image"
            ) {

                addFileCard(
                    "📷",
                    "Изображение",
                    item.text
                );


            } else if (
                item.type
                === "document"
            ) {

                addFileCard(
                    "📄",
                    item.filename
                    ||
                    "PDF",
                    item.text
                );


            } else {

                addTextMessage(
                    item.text,
                    item.role
                );
            }
        }
    );
}


function renderChatList() {

    chatList.innerHTML =
        "";


    chats
    .slice()
    .reverse()
    .forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "history-item";


            if (
                item.id
                === activeChatId
            ) {

                row.classList
                .add(
                    "active"
                );
            }


            const open =
                document.createElement(
                    "button"
                );


            open.className =
                "history-open";


            open.innerHTML =
                `
                <div class="history-title">
                    ${item.title || "Новый чат"}
                </div>
                <div class="history-date">
                    ${new Date(item.updatedAt).toLocaleString("ru-RU")}
                </div>
                `;


            open.onclick =
                () =>
                    openChat(
                        item.id
                    );


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "history-delete";


            del.textContent =
                "🗑️";


            del.onclick =
                () =>
                    deleteChat(
                        item.id
                    );


            row.appendChild(
                open
            );


            row.appendChild(
                del
            );


            chatList.appendChild(
                row
            );
        }
    );
}


function openDrawer() {

    drawer.classList.add(
        "open"
    );


    overlay.classList.add(
        "open"
    );
}


function closeDrawer() {

    drawer.classList.remove(
        "open"
    );


    overlay.classList.remove(
        "open"
    );
}


function openChat(id) {

    saveActiveChat();


    activeChatId =
        id;


    const current =
        getActiveChat();


    history =
        current.history
        ||
        [];


    saveChats();

    renderCurrentChat();

    closeDrawer();
}


function newChat() {

    saveActiveChat();


    const fresh =
        createEmptyChat();


    chats.push(
        fresh
    );


    activeChatId =
        fresh.id;


    history =
        [];


    saveChats();

    renderCurrentChat();

    closeDrawer();
}


function deleteChat(id) {

    if (
        !confirm(
            "Удалить чат?"
        )
    ) {
        return;
    }


    chats =
        chats.filter(
            item =>
                item.id
                !== id
        );


    if (
        !chats.length
    ) {

        chats.push(
            createEmptyChat()
        );
    }


    activeChatId =
        chats[
            chats.length - 1
        ].id;


    history =
        getActiveChat()
        .history
        ||
        [];


    saveChats();

    renderCurrentChat();

    renderChatList();
}


fileInput.addEventListener(
    "change",
    function() {

        const file =
            fileInput.files[0];


        if (!file) {
            return;
        }


        removeSelectedAttachment(
            false
        );


        selectedFile =
            file;


        if (
            file.type
            .startsWith(
                "image/"
            )
        ) {

            selectedFileType =
                "image";


            selectedImageURL =
                URL.createObjectURL(
                    file
                );


            imagePreview.src =
                selectedImageURL;


            imagePreview.style.display =
                "block";


            pdfPreview.style.display =
                "none";


            input.placeholder =
                "Спросите что-нибудь о фото...";


        } else if (
            file.type
            === "application/pdf"
            ||
            file.name
            .toLowerCase()
            .endsWith(
                ".pdf"
            )
        ) {

            selectedFileType =
                "pdf";


            imagePreview.style.display =
                "none";


            pdfPreview.style.display =
                "flex";


            pdfPreviewName.textContent =
                file.name;


            input.placeholder =
                "Спросите что-нибудь о PDF...";


        } else {

            alert(
                "Поддерживаются фото и PDF."
            );


            return;
        }


        attachmentPreviewArea
        .style
        .display =
            "block";
    }
);


function removeSelectedAttachment(
    clearInput = true
) {

    selectedFile =
        null;


    selectedFileType =
        null;


    if (
        selectedImageURL
    ) {

        URL.revokeObjectURL(
            selectedImageURL
        );


        selectedImageURL =
            null;
    }


    imagePreview.src =
        "";


    imagePreview.style.display =
        "none";


    pdfPreview.style.display =
        "none";


    attachmentPreviewArea
    .style
    .display =
        "none";


    input.placeholder =
        "Сообщение Wiens AI...";


    if (
        clearInput
    ) {

        fileInput.value =
            "";
    }
}


async function sendMessage() {

    const text =
        input.value
        .trim();


    if (
        !text
        &&
        !selectedFile
    ) {
        return;
    }


    if (
        selectedFileType
        === "image"
    ) {

        await sendImage(
            text
        );


        return;
    }


    if (
        selectedFileType
        === "pdf"
    ) {

        await sendPdf(
            text
        );


        return;
    }


    addTextMessage(
        text,
        "user"
    );


    remember(
        "user",
        "text",
        text
    );


    input.value =
        "";


    const thinking =
        addTextMessage(
            "Wiens AI думает…",
            "assistant thinking"
        );


    sendButton.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (
            !response.ok
        ) {

            addTextMessage(
                data.error,
                "assistant"
            );


            return;
        }


        addTextMessage(
            data.answer,
            "assistant"
        );


        history.push({
            role:
                "user",

            content:
                text
        });


        history.push({
            role:
                "assistant",

            content:
                data.answer
        });


        remember(
            "assistant",
            "text",
            data.answer
        );


        if (
            speechEnabled
        ) {

            speakText(
                data.answer
            );
        }


    } catch {

        thinking.remove();


        addTextMessage(
            "Ошибка соединения.",
            "assistant"
        );


    } finally {

        sendButton.disabled =
            false;
    }
}


async function sendImage(text) {

    const file =
        selectedFile;


    const question =
        text
        ||
        "Что изображено на этой фотографии?";


    addFileCard(
        "📷",
        file.name,
        text
    );


    remember(
        "user",
        "image",
        question,
        file.name
    );


    input.value =
        "";


    removeSelectedAttachment();


    const thinking =
        addTextMessage(
            "Wiens AI анализирует изображение…",
            "assistant thinking"
        );


    sendButton.disabled =
        true;


    try {

        const form =
            new FormData();


        form.append(
            "image",
            file
        );


        form.append(
            "message",
            question
        );


        const response =
            await fetch(
                "/api/vision",
                {
                    method:
                        "POST",

                    body:
                        form
                }
            );


        const data =
            await response.json();


        thinking.remove();


        addTextMessage(

        );


        if (
            response.ok
        ) {

            history.push({
                role:
                    "user",

                content:

            });


            history.push({
                role:
                    "assistant",

                content:
                    data.answer
            });


            remember(
                "assistant",
                "text",
                data.answer
            );
        }


    } finally {

        sendButton.disabled =
            false;
    }
}


async function sendPdf(text) {

    const file =
        selectedFile;


    const question =
        text
        ||
        "Кратко объясни этот PDF и выдели самое важное.";


    addFileCard(
        "📄",
        file.name,
        text
    );


    remember(
        "user",
        "document",
        question,
        file.name
    );


    input.value =
        "";


    removeSelectedAttachment();


    const thinking =
        addTextMessage(
            "Wiens AI читает PDF…",
            "assistant thinking"
        );


    sendButton.disabled =
        true;


    try {

        const form =
            new FormData();


        form.append(
            "document",
            file
        );


        form.append(
            "message",
            question
        );


        const response =
            await fetch(
                "/api/document",
                {
                    method:
                        "POST",

                    body:

                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (
            !response.ok
        ) {

            addTextMessage(

                ||
                "Не удалось прочитать PDF.",
                "assistant"
            );


            return;
        }


        addTextMessage(
            data.answer,

        );


        history.push({
            role:
                "user",

            content:
                "[PDF] "

                +
                ": "
                +

        });


        history.push({
            role:
                "assistant",

            content:
                data.answer
        });


        remember(
            "assistant",
            "text",
            data.answer
        );


        if (
            speechEnabled
        ) {

            speakText(
                data.answer
            );
        }


    } finally {

        sendButton.disabled =
            false;
    }
}


async function toggleRecording() {

    if (
        recording
    ) {

        mediaRecorder.stop();

        return;
    }


    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:
                    true
            });


        let options =
            {};


        if (
            MediaRecorder
            .isTypeSupported(
                "audio/mp4"
            )
        ) {

            options = {
                mimeType:
                    "audio/mp4"
            };
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        audioChunks =
            [];


        mediaRecorder
        .ondataavailable =
            event => {

                if (
                    event.data.size
                    >
                    0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder
        .onstop =
            async () => {

                recording =
                    false;


                micButton.textContent =
                    "🎙️";


                micButton.classList
                .remove(
                    "recording"
                );


                stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType
                        }
                    );


                await transcribeAudio(
                    blob,
                    mediaRecorder.mimeType
                );
            };


        mediaRecorder.start();


        recording =
            true;


        micButton.textContent =
            "⏹️";


        micButton.classList
        .add(
            "recording"
        );


    } catch {

        alert(
            "Разрешите доступ к микрофону."
        );
    }
}


async function transcribeAudio(
    blob,
    mime
) {

    const form =
        new FormData();


    form.append(
        "audio",
        blob,
        mime.includes(
            "mp4"
        )
        ?
        "voice.mp4"
        :
        "voice.webm"
    );


    const response =
        await fetch(
            "/api/transcribe",
            {
                method:
                    "POST",

                body:
                    form
            }
        );


    const data =
        await response.json();


    if (
        data.text
    ) {

        input.value =
            data.text;


        await sendMessage();
    }
}


function speakText(text) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if (
        /[А-Яа-яЁё]/
        .test(
            text
        )
    ) {

        utterance.lang =
            "ru-RU";


    } else {

        utterance.lang =
            "de-DE";
    }


    speechSynthesis.speak(
        utterance
    );
}


function toggleSpeech() {

    speechEnabled =
        !speechEnabled;


    speakerButton.textContent =
        speechEnabled
        ?
        "🔊"
        :
        "🔇";


    if (
        !speechEnabled
    ) {

        speechSynthesis.cancel();
    }
}


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key
            === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();


            sendMessage();
        }
    }
);


if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator
            .serviceWorker
            .register(
                "/service-worker.js"
            );
        }
    );
}
